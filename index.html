/* =========================================================
   InsanAsia LMS – Tema Ungu • Putih • Hitam
   ========================================================= */
:root {
  color-scheme: light only;
  --p: #6D28D9;          /* ungu utama */
  --p-600: #5B21B6;
  --p-700: #4C1D95;
  --p-400: #8B5CF6;
  --p-100: #EDE9FE;
  --p-50: #F5F3FF;
  --ink: #0B0A10;        /* hitam */
  --ink-2: #1A1824;
  --ink-3: #2A2737;
  --text: #17151F;
  --muted: #5F5B6E;
  --line: #E6E3EE;
  --bg: #FFFFFF;
  --bg-2: #FAF9FC;
  --green: #0F7B4E; --green-bg: #E3F6EC;
  --amber: #8A5A00; --amber-bg: #FFF3D6;
  --red: #B42318; --red-bg: #FDE8E7;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(17, 12, 34, .05), 0 8px 24px rgba(17, 12, 34, .06);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
img { max-width: 100%; display: block; }
a { color: var(--p); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; color: var(--ink); letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 800; }
h2 { font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--p-400); outline-offset: 2px; border-radius: 6px; }
.container { width: min(1180px, 100% - 40px); margin-inline: auto; }
.muted { color: var(--muted); }
.ic { flex-shrink: 0; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.center { text-align: center; }
.mt { margin-top: 1rem; } .mt2 { margin-top: 2rem; } .mb { margin-bottom: 1rem; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .72rem 1.2rem; border-radius: 10px; border: 1.5px solid transparent; font: inherit; font-weight: 700; font-size: .93rem; cursor: pointer; transition: .15s; text-decoration: none !important; white-space: nowrap; min-height: 42px; }
.btn-sm { padding: .45rem .85rem; font-size: .85rem; min-height: 36px; }
.btn-xs { padding: .25rem .55rem; font-size: .78rem; min-height: 30px; border-radius: 8px; }
.btn-lg { padding: .95rem 1.6rem; font-size: 1rem; }
.btn-primary { background: var(--p); color: #fff; }
.btn-primary:hover { background: var(--p-600); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: var(--ink-3); }
.btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--p-400); color: var(--p); }
.btn-outline-w { color: #fff; border-color: rgba(255, 255, 255, .5); background: transparent; }
.btn-outline-w:hover { background: rgba(255, 255, 255, .1); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { filter: brightness(.92); }
.btn-soft { background: var(--p-50); color: var(--p-700); }
.btn-soft:hover { background: var(--p-100); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: inherit; cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--p-50); color: var(--p); }

/* ---------- Badge ---------- */
.badge { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .6rem; border-radius: 99px; font-size: .74rem; font-weight: 700; background: #F1F0F4; color: var(--ink-3); white-space: nowrap; }
.badge.purple { background: var(--p-100); color: var(--p-700); }
.badge.dark { background: var(--ink); color: #fff; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.gray { background: #F1F0F4; color: #4B4759; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: .6rem; font-weight: 800; color: var(--ink); text-decoration: none !important; font-size: 1.08rem; }
.logo.light { color: #fff; }
.logo-mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--p-400), var(--p-700)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.logo-img { height: 40px; width: auto; max-width: 140px; object-fit: contain; border-radius: 8px; }
.logo.light .logo-img { background: #fff; padding: 3px; }

/* ---------- Header publik ---------- */
.announce { background: var(--ink); color: #fff; text-align: center; font-size: .85rem; padding: .5rem 1rem; }
.announce span { opacity: .75; }
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 1.5rem; height: 70px; }
.mainnav { display: flex; gap: .2rem; margin-left: auto; }
.mainnav a { color: var(--ink-3); font-weight: 600; font-size: .92rem; padding: .5rem .75rem; border-radius: 8px; text-decoration: none; }
.mainnav a:hover, .mainnav a.active { color: var(--p); background: var(--p-50); }
.nav-actions { display: flex; gap: .5rem; }
.nav-actions-m, .burger, .mainnav .nav-ic { display: none; }
.nav-scrim { display: none; }

/* ---------- Hero ---------- */
.hero { background: radial-gradient(1200px 500px at 85% -10%, rgba(139, 92, 246, .45), transparent 60%), linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 55%, #241446 100%); color: #fff; overflow: hidden; position: relative; }
.hero-in { display: grid; grid-template-columns: 1.15fr .85fr; gap: 3rem; align-items: center; padding: 5rem 0 5.5rem; }
.hero h1 { color: #fff; }
.hero p.lead { font-size: 1.08rem; color: #D9D4E8; max-width: 560px; }
.eyebrow { display: inline-flex; gap: .4rem; align-items: center; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--p-400); margin-bottom: 1rem; }
.hero .eyebrow { color: #C4B5FD; }
.hero-stats { display: flex; gap: 2.2rem; margin-top: 2.4rem; flex-wrap: wrap; }
.hero-stats b { display: block; font-size: 1.7rem; color: #fff; }
.hero-stats span { color: #B9B2CC; font-size: .85rem; }
.hero-card { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 22px; padding: 1.4rem; backdrop-filter: blur(6px); }
.hero-card .hc-row { display: flex; gap: .8rem; align-items: center; background: #fff; color: var(--text); border-radius: 14px; padding: .9rem 1rem; margin-bottom: .7rem; }
.hero-card .hc-row:last-child { margin-bottom: 0; }
.hero-card .hc-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--p-100); color: var(--p); }
.hero-card small { color: var(--muted); display: block; font-size: .78rem; }
.hero-img { border-radius: 22px; width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid rgba(255, 255, 255, .15); }

/* ---------- Section ---------- */
.section { padding: 4.5rem 0; }
.section.alt { background: var(--bg-2); }
.section.dark { background: var(--ink); color: #E5E1F0; }
.section.dark h2, .section.dark h3 { color: #fff; }
.sec-head { max-width: 680px; margin-bottom: 2.2rem; }
.sec-head.center { margin-inline: auto; text-align: center; }
.sec-head p { color: var(--muted); }
.section.dark .sec-head p { color: #B9B2CC; }

.cards { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.cards.c4 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.3rem; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.hover { transition: .18s; }
.card.hover:hover { transform: translateY(-3px); border-color: var(--p-400); }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.card-title h3 { margin: 0; }
.cat-card { display: flex; flex-direction: column; gap: .5rem; color: inherit; text-decoration: none !important; }
.cat-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--p-50); color: var(--p); display: grid; place-items: center; }
.cat-card:hover .cat-ic { background: var(--p); color: #fff; }
.feature { display: flex; gap: 1rem; }
.feature .cat-ic { flex-shrink: 0; }
.section.dark .feature .cat-ic { background: rgba(139, 92, 246, .18); color: #C4B5FD; }
.section.dark .feature p { color: #B9B2CC; margin: 0; }

/* Kartu program */
.pcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; color: inherit; text-decoration: none !important; }
.pcard .pc-body { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
.pcard h3 { margin: 0; font-size: 1.05rem; }
.pcard p { color: var(--muted); font-size: .9rem; margin: 0; }
.pc-meta { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: auto; padding-top: .6rem; }
.thumb { aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: var(--p-100); }
.thumb.gen { background: radial-gradient(circle at 85% 15%, rgba(255, 255, 255, .25), transparent 40%), linear-gradient(135deg, var(--tc), var(--ink)); color: #fff; padding: 1.1rem; display: flex; flex-direction: column; justify-content: flex-end; }
.thumb.gen span { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; opacity: .8; font-weight: 700; }
.thumb.gen b { font-size: 1.15rem; line-height: 1.25; }
.thumb.big { aspect-ratio: 16/8; border-radius: var(--radius); }
.thumb.big.gen b { font-size: 1.6rem; }

/* Testimoni */
.quote { position: relative; }
.quote p { font-size: .98rem; }
.quote .who { display: flex; align-items: center; gap: .7rem; }
.quote .who small { color: var(--muted); display: block; }

/* FAQ */
.faq details { border: 1px solid var(--line); border-radius: 12px; padding: 0 1.1rem; background: #fff; margin-bottom: .7rem; }
.faq summary { cursor: pointer; font-weight: 700; padding: 1rem 0; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::after { content: '+'; color: var(--p); font-size: 1.3rem; line-height: 1; }
.faq details[open] summary::after { content: '–'; }
.faq details p { color: var(--muted); }

/* CTA */
.cta { background: linear-gradient(135deg, var(--p) 0%, var(--p-700) 60%, var(--ink) 100%); border-radius: 24px; padding: 3rem; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
.cta h2 { color: #fff; margin: 0 0 .3rem; }
.cta p { color: #E4DCFB; margin: 0; }

/* Footer */
.footer { background: var(--ink); color: #B9B2CC; padding: 3.5rem 0 1.5rem; margin-top: 0; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.3fr; gap: 2rem; }
.footer h4 { color: #fff; font-size: .95rem; margin-bottom: .9rem; }
.footer a { color: #D7D1E6; display: block; margin-bottom: .45rem; font-size: .9rem; }
.footer p { font-size: .9rem; margin-bottom: .5rem; display: flex; gap: .5rem; align-items: flex-start; }
.footer p a { display: inline; }
.footer .muted-l { display: block; margin-top: 1rem; }
.footer .tag { color: var(--p-400); font-weight: 800; letter-spacing: .04em; }
.socials { display: flex; gap: .8rem; flex-wrap: wrap; }
.socials a { display: inline; }
.copy { border-top: 1px solid rgba(255, 255, 255, .1); margin-top: 2.5rem; padding-top: 1.3rem; font-size: .83rem; }

/* Page header publik */
.page-hero { background: linear-gradient(160deg, var(--ink), #241446); color: #fff; padding: 3.2rem 0; }
.page-hero h1 { color: #fff; font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
.page-hero p { color: #CFC8E0; max-width: 680px; margin: 0; }
.crumbs { font-size: .83rem; color: #B9B2CC; margin-bottom: .8rem; }
.crumbs a { color: #C4B5FD; }

/* Filter */
.filters { display: flex; gap: .7rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
.filters .search { flex: 1; min-width: 220px; position: relative; }
.filters .search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.filters .search input { padding-left: 2.4rem; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: .4rem .9rem; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--ink-3); }
.chip.on, .chip:hover { border-color: var(--p); color: var(--p); background: var(--p-50); }

/* Detail program */
.detail-grid { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; align-items: start; }
.sticky { position: sticky; top: 90px; }
.objectives { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.objectives li { display: flex; gap: .6rem; }
.objectives .ic { color: var(--p); margin-top: 3px; }
.curriculum .mod { border: 1px solid var(--line); border-radius: 12px; margin-bottom: .6rem; overflow: hidden; }
.curriculum .mod-h { background: var(--bg-2); padding: .8rem 1rem; font-weight: 700; display: flex; justify-content: space-between; gap: 1rem; }
.curriculum .les { padding: .6rem 1rem; display: flex; gap: .6rem; align-items: center; border-top: 1px solid var(--line); font-size: .92rem; }
.curriculum .les .ic { color: var(--p); }
.batch { border: 1.5px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: .8rem; }
.batch.full { opacity: .65; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }

/* Article */
.prose { max-width: 760px; font-size: 1.02rem; }
.prose h3 { margin-top: 1.6rem; }
.prose ul, .prose ol { padding-left: 1.3rem; }
.prose li { margin-bottom: .3rem; }

/* ---------- Auth ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { background: radial-gradient(800px 400px at 100% 0, rgba(139, 92, 246, .5), transparent 60%), linear-gradient(160deg, var(--ink), #1f1238); color: #fff; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; }
.auth-side h2 { color: #fff; font-size: 2rem; }
.auth-side p { color: #CFC8E0; }
.auth-form { display: grid; place-items: center; padding: 2.5rem 1.5rem; }
.auth-box { width: min(440px, 100%); }
.auth-box h1 { font-size: 1.8rem; }
.demo-box { background: var(--p-50); border: 1px dashed var(--p-400); border-radius: 12px; padding: 1rem; margin-top: 1.5rem; font-size: .85rem; }
.demo-box h4 { font-size: .85rem; margin-bottom: .5rem; color: var(--p-700); }
.demo-list { display: grid; gap: .35rem; }
.demo-list button { display: flex; justify-content: space-between; gap: .5rem; width: 100%; border: 1px solid var(--p-100); background: #fff; border-radius: 8px; padding: .45rem .7rem; font: inherit; font-size: .82rem; cursor: pointer; text-align: left; }
.demo-list button:hover { border-color: var(--p); }
.demo-list code { color: var(--p-700); font-weight: 700; }

/* ---------- Form ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.1rem; }
.form-grid .field.full, .form-grid .field.check, .form-grid [data-field] textarea { grid-column: 1 / -1; }
.form-grid .field:has(textarea) { grid-column: 1 / -1; }
.form-1 { display: grid; gap: 1rem; }
.field { display: flex; flex-direction: column; gap: .35rem; }
.field label { font-weight: 600; font-size: .88rem; color: var(--ink-3); }
.field.check label { display: flex; gap: .5rem; align-items: center; font-weight: 600; }
.req { color: var(--red); }
.help { color: var(--muted); font-size: .78rem; }
.err { color: var(--red); font-size: .78rem; min-height: 0; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); background: #FFF8F7; }
input, select, textarea { font: inherit; font-size: .93rem; padding: .68rem .85rem; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--text); width: 100%; transition: .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 4px rgba(109, 40, 217, .12); }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--p); padding: 0; }
input[type=file] { padding: .5rem; background: var(--bg-2); }
input[type=color] { height: 42px; padding: 4px; }
textarea { resize: vertical; }

/* ---------- App layout ---------- */
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; background: var(--bg-2); }
.sidebar { background: var(--ink); color: #CFC8E0; padding: 1.2rem 1rem; display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar .logo { padding: .3rem .4rem; }
.role-chip { display: inline-flex; gap: .4rem; align-items: center; align-self: flex-start; background: rgba(139, 92, 246, .18); color: #D8CCFF; font-size: .75rem; font-weight: 700; padding: .3rem .7rem; border-radius: 99px; margin-left: .4rem; }
.side-nav, .side-foot { display: flex; flex-direction: column; gap: .15rem; }
.side-nav a, .side-foot a { display: flex; gap: .7rem; align-items: center; color: #CFC8E0; padding: .62rem .8rem; border-radius: 10px; font-weight: 600; font-size: .9rem; text-decoration: none; }
.side-nav a:hover, .side-foot a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.side-nav a.active { background: var(--p); color: #fff; }
.side-foot { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .08); padding-top: .8rem; }
.app-main { min-width: 0; display: flex; flex-direction: column; }
.app-top { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.8rem; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.app-title { flex: 1; min-width: 0; }
.app-title h1 { font-size: 1.3rem; margin: 0; }
.app-title p { margin: 0; color: var(--muted); font-size: .86rem; }
.app-top-r { display: flex; align-items: center; gap: .6rem; }
.notif i { position: absolute; top: 4px; right: 4px; background: var(--p); color: #fff; font-style: normal; font-size: .65rem; font-weight: 800; min-width: 17px; height: 17px; border-radius: 99px; display: grid; place-items: center; padding: 0 4px; }
.me { display: flex; gap: .6rem; align-items: center; color: inherit; text-decoration: none !important; }
.me-name { display: flex; flex-direction: column; line-height: 1.2; }
.me small { color: var(--muted); font-size: .75rem; }
.avatar { display: inline-flex; align-items: center; justify-content: center; text-align: center; line-height: 1; letter-spacing: .03em; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .28), transparent 55%), linear-gradient(135deg, var(--p-400), var(--p-700)); color: #fff; font-weight: 800; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--p-100); user-select: none; overflow: hidden; }
.app-content { padding: 1.8rem; display: flex; flex-direction: column; gap: 1.4rem; }
.page-actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; margin-bottom: -.4rem; }
.burger-app { display: none; }
.side-overlay { display: none; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; }
.grid-21 { display: grid; grid-template-columns: 2fr 1fr; gap: 1.4rem; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem; display: flex; gap: .9rem; align-items: center; }
.stat-ic { width: 46px; height: 46px; border-radius: 12px; background: var(--p-50); color: var(--p); display: grid; place-items: center; }
.stat:nth-child(2) .stat-ic { background: var(--ink); color: #fff; }
.stat-v { font-size: 1.5rem; font-weight: 800; color: var(--ink); line-height: 1.1; }
.stat-l { color: var(--muted); font-size: .83rem; font-weight: 600; }
.stat-s { font-size: .75rem; color: var(--p-600); font-weight: 600; }
.welcome { background: linear-gradient(135deg, var(--ink) 0%, #2a1752 60%, var(--p) 130%); color: #fff; border-radius: 18px; padding: 1.8rem; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
.welcome h2 { color: #fff; margin: 0 0 .3rem; }
.welcome p { color: #D9D4E8; margin: 0; }

.progress { height: 8px; background: var(--p-100); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--p-400), var(--p)); border-radius: 99px; }

/* Tabel */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .8rem 1rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--bg-2); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #FCFBFE; }
td .row { flex-wrap: nowrap; }
.cell-user { display: flex; gap: .6rem; align-items: center; }
.cell-user small { display: block; color: var(--muted); }

/* List */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: .9rem; align-items: center; padding: .85rem 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item .li-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--p-50); color: var(--p); display: grid; place-items: center; flex-shrink: 0; }
.list-item .li-b { flex: 1; min-width: 0; }
.list-item .li-b b { display: block; }
.list-item .li-b small { color: var(--muted); }
.unread { background: var(--p-50); border-radius: 10px; padding-inline: .7rem; }

/* Tabs */
.tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: 1.2rem; overflow-x: auto; }
.tab { border: 0; background: none; font: inherit; font-weight: 700; font-size: .9rem; color: var(--muted); padding: .7rem 1rem; border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--p); border-color: var(--p); }

/* Classroom */
.classroom { display: grid; grid-template-columns: 320px 1fr; gap: 1.4rem; align-items: start; }
.syllabus { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: sticky; top: 90px; max-height: calc(100vh - 110px); overflow-y: auto; }
.syllabus .sy-h { padding: 1rem; border-bottom: 1px solid var(--line); }
.syllabus .sy-mod { padding: .7rem 1rem .3rem; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.syllabus a { display: flex; gap: .6rem; padding: .55rem 1rem; color: var(--ink-3); font-size: .88rem; text-decoration: none; align-items: flex-start; }
.syllabus a:hover { background: var(--p-50); }
.syllabus a.on { background: var(--p-50); color: var(--p-700); font-weight: 700; box-shadow: inset 3px 0 0 var(--p); }
.syllabus .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
.syllabus .tick.done { background: var(--p); border-color: var(--p); color: #fff; }
.viewer { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.6rem; min-width: 0; }
.embed { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--ink); }
.embed iframe, .embed video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pdf-frame { width: 100%; height: 72vh; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
.linkbox { display: flex; gap: 1rem; align-items: center; border: 1.5px dashed var(--p-400); background: var(--p-50); border-radius: 12px; padding: 1.1rem; flex-wrap: wrap; }

/* Kuis */
.qcard { border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; background: #fff; }
.qcard h4 { font-size: 1rem; margin-bottom: .8rem; }
.opt { display: flex; gap: .7rem; align-items: center; padding: .65rem .8rem; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: .45rem; cursor: pointer; }
.opt:hover { border-color: var(--p-400); }
.opt:has(input:checked) { border-color: var(--p); background: var(--p-50); }
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.score-ring { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 1rem; background: conic-gradient(var(--p) calc(var(--v) * 1%), var(--p-100) 0); }
.score-ring b { width: 104px; height: 104px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 1.8rem; color: var(--ink); }

/* Sertifikat */
.cert { background: #fff; border: 10px solid var(--ink); outline: 2px solid var(--p); outline-offset: -18px; padding: 3rem 3.2rem; text-align: center; aspect-ratio: 1.414/1; display: flex; flex-direction: column; justify-content: center; gap: .4rem; position: relative; max-width: 960px; margin: 0 auto; }
.cert::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 0 0, rgba(109, 40, 217, .12), transparent 30%), radial-gradient(circle at 100% 100%, rgba(109, 40, 217, .12), transparent 30%); pointer-events: none; }
.cert .c-logo { display: flex; justify-content: center; margin-bottom: .6rem; }
.cert h2 { font-size: 2.2rem; letter-spacing: .12em; margin: 0; }
.cert .c-name { font-size: 2.1rem; font-weight: 800; color: var(--p-700); border-bottom: 2px solid var(--line); display: inline-block; padding: 0 2rem .3rem; margin: .4rem auto; }
.cert .c-prog { font-size: 1.3rem; font-weight: 800; color: var(--ink); }
.cert .c-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2rem; font-size: .85rem; text-align: left; }
.cert .c-sign { text-align: center; }
.cert .c-sign b { display: block; border-top: 1.5px solid var(--ink); padding-top: .3rem; margin-top: 2.2rem; }

/* Chart */
.hbars { display: flex; flex-direction: column; gap: .7rem; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 56px; gap: .8rem; align-items: center; font-size: .86rem; }
.hbar-l { color: var(--ink-3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-t { height: 12px; background: var(--bg-2); border-radius: 4px; }
.hbar-t span { display: block; height: 100%; background: var(--p); border-radius: 0 4px 4px 0; }
.hbar:hover .hbar-t span { background: var(--p-700); }
.hbar-v { font-weight: 700; color: var(--ink); text-align: right; }
.linechart { width: 100%; height: auto; }
.linechart .grid { stroke: var(--line); stroke-width: 1; }
.linechart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.linechart .ln { fill: none; stroke-width: 2.25; }
.linechart .ln.s0 { stroke: var(--p); } .linechart .ln.s1 { stroke: var(--ink); }
.linechart .dot { stroke: #fff; stroke-width: 2; cursor: pointer; }
.linechart .dot.s0 { fill: var(--p); } .linechart .dot.s1 { fill: var(--ink); }
.linechart .dot:hover { r: 7; }
.legend { display: flex; gap: 1.2rem; font-size: .82rem; color: var(--ink-3); margin-bottom: .5rem; font-weight: 600; }
.legend .sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: .4rem; vertical-align: middle; }
.legend .sw.s0 { background: var(--p); } .legend .sw.s1 { background: var(--ink); }

/* Empty */
.empty { text-align: center; padding: 2.2rem 1rem; color: var(--muted); }
.empty .ic { color: var(--p-400); margin-bottom: .5rem; }

/* Modal */
.modal-wrap { position: fixed; inset: 0; background: rgba(11, 10, 16, .55); z-index: 100; display: grid; place-items: center; padding: 1rem; animation: fade .15s; }
.modal { background: #fff; border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, .3); }
.modal.lg { width: min(820px, 100%); }
.modal.xl { width: min(1040px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; }
.modal-body { padding: 1.4rem; overflow-y: auto; }
.modal-foot { padding: 1rem 1.4rem; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .6rem; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }

/* Toast */
#toasts { position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 200; display: flex; flex-direction: column; gap: .5rem; }
.toast { display: flex; gap: .6rem; align-items: center; background: var(--ink); color: #fff; padding: .8rem 1.1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); font-size: .9rem; font-weight: 600; max-width: 380px; animation: slide .2s; border-left: 4px solid var(--p-400); }
.toast.error { border-left-color: #F97066; }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
@keyframes slide { from { transform: translateY(10px); opacity: 0; } }

/* Settings */
.logo-preview { width: 120px; height: 120px; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; background: var(--bg-2); overflow: hidden; }
.logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.notice { background: var(--p-50); border: 1px solid var(--p-100); border-radius: 12px; padding: 1rem 1.1rem; font-size: .9rem; color: var(--ink-3); }
.notice.warn { background: var(--amber-bg); border-color: #F5DFA6; }
.mod-block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 1rem; background: #fff; }
.mod-block-h { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .85rem 1rem; background: var(--bg-2); border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; flex-wrap: wrap; }
.mod-block-h b { font-size: .95rem; }
.les-row { display: flex; align-items: center; gap: .7rem; padding: .65rem 1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.les-row:last-child { border-bottom: 0; }
.les-row .li-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--p-50); color: var(--p); display: grid; place-items: center; }
.qedit { border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: .8rem; background: var(--bg-2); }
.qedit .opt-row { display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem; }

/* Print */
@media print {
  .sidebar, .app-top, .page-actions, .no-print, #toasts, .topbar, .footer, .announce { display: none !important; }
  .app { display: block; background: #fff; }
  .app-content { padding: 0; }
  .cert { border-width: 8px; width: 100%; max-width: none; page-break-inside: avoid; }
  body { background: #fff; }
  @page { size: A4 landscape; margin: 10mm; }
}

/* ---------- Responsif ---------- */
@media (max-width: 1080px) {
  .grid3 { grid-template-columns: 1fr 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .sticky { position: static; }
}

  .topbar-in { height: 64px; }
  .mainnav { position: absolute; left: 12px; right: 12px; top: calc(100% + 10px); margin: 0; flex-direction: column; gap: 2px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 60px rgba(17, 12, 34, .18); max-height: calc(100vh - 100px); overflow-y: auto; z-index: 45;
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-12px) scale(.98); transform-origin: top center;
    transition: opacity .25s ease, transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .35s; }

  .nav-actions-m .btn:only-child { grid-column: 1 / -1; }
  .mainnav .nav-actions-m .btn-primary, .mainnav .nav-actions-m .btn-primary:hover { color: #fff; background: var(--p); }
  .mainnav .nav-actions-m .btn-primary:hover { background: var(--p-600); }
  .mainnav .nav-actions-m .btn-ghost { color: var(--ink); background: #fff; }
  .mainnav .nav-actions-m .btn { justify-content: center; padding: .7rem 1rem; }
  .nav-scrim { display: block; position: fixed; inset: 0; background: rgba(11, 10, 16, .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 35; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s; }
  body.nav-open .nav-scrim { opacity: 1; visibility: visible; transition-delay: 0s; }

  .burger span { display: block; width: 20px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
  body.nav-open .burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }

  .hero-in { grid-template-columns: 1fr; padding: 3.5rem 0; }

/* =========================================================
   ANIMASI & MIKRO-INTERAKSI
   ========================================================= */
@media (prefers-reduced-motion: no-preference) {
  /* Masuk halaman */
  .page-enter { animation: pageIn .3s ease-out both; }
  @keyframes pageIn { from { opacity: .4; } }

  /* Muncul saat di-scroll (diaktifkan oleh JS) */
  .rv { opacity: 0; transform: translateY(24px); transition: opacity .65s cubic-bezier(.2, .8, .2, 1), transform .65s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--d, 0) * 70ms); }
  .rv.in { opacity: 1; transform: none; }

  /* Hero */
  .hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; }
  .hero::before { width: 380px; height: 380px; background: rgba(139, 92, 246, .35); top: -120px; right: 8%; animation: blob 14s ease-in-out infinite; }
  .hero::after { width: 300px; height: 300px; background: rgba(109, 40, 217, .3); bottom: -140px; left: -60px; animation: blob 18s ease-in-out infinite reverse; }
  .hero-in { position: relative; z-index: 1; }
  @keyframes blob { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(40px, 30px) scale(1.1); } 66% { transform: translate(-30px, 20px) scale(.95); } }
  .first-load .hero .eyebrow, .first-load .hero h1, .first-load .hero .lead, .first-load .hero .row, .first-load .hero-stats, .first-load .hero-card, .first-load .hero-img { animation: heroIn .9s cubic-bezier(.2, .8, .2, 1) both; }
  .first-load .hero h1 { animation-delay: .08s; } .first-load .hero .lead { animation-delay: .16s; } .first-load .hero .row { animation-delay: .24s; } .first-load .hero-stats { animation-delay: .32s; }
  .first-load .hero-card, .first-load .hero-img { animation-delay: .3s; }
  @keyframes heroIn { from { opacity: 0; transform: translateY(26px); } }
  .hero-card .hc-row { animation: floatY 6s ease-in-out infinite; }
  .hero-card .hc-row:nth-child(2) { animation-delay: -2s; } .hero-card .hc-row:nth-child(3) { animation-delay: -4s; }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .page-hero { background-size: 160% 160%; animation: gradShift 16s ease infinite; }
  .welcome, .cta { background-size: 180% 180%; animation: gradShift 14s ease infinite; }
  @keyframes gradShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* Tombol */
  .btn { transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, background .2s, border-color .2s, color .2s; }
  .btn:not(:disabled):hover { transform: translateY(-2px); }
  .btn-primary:not(:disabled):hover { box-shadow: 0 10px 24px rgba(109, 40, 217, .35); }
  .btn-dark:not(:disabled):hover { box-shadow: 0 10px 24px rgba(11, 10, 16, .3); }
  .btn:not(:disabled):active { transform: translateY(0) scale(.97); }
  .icon-btn { transition: background .2s, color .2s, transform .2s; }
  .icon-btn:active { transform: scale(.92); }

  /* Kartu */
  .card, .stat { transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, border-color .3s; }
  .card.hover:hover, .pcard:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(17, 12, 34, .12); border-color: var(--p-400); }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(17, 12, 34, .08); }
  .pcard .thumb { transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
  .pcard:hover .thumb { transform: scale(1.05); }
  .cat-ic, .stat-ic { transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), background .25s, color .25s; }
  .cat-card:hover .cat-ic, .stat:hover .stat-ic { transform: rotate(-8deg) scale(1.08); }
  .logo-mark { transition: transform .4s cubic-bezier(.3, 1.4, .5, 1); }
  .logo:hover .logo-mark { transform: rotate(-10deg) scale(1.06); }

  /* Navigasi */
  .mainnav a, .side-nav a, .side-foot a { transition: background .2s, color .2s, transform .2s; }
  .side-nav a:hover, .side-foot a:hover { transform: translateX(4px); }
  .tab { transition: color .2s, border-color .25s; }
  .chip { transition: all .2s; }
  .chip:active { transform: scale(.95); }
  @media (max-width: 980px) {
    .mainnav a, .nav-actions-m { opacity: 0; transform: translateY(-8px); transition: opacity .3s ease, transform .35s cubic-bezier(.2, .8, .2, 1), background .2s; }
    body.nav-open .mainnav a, body.nav-open .nav-actions-m { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 45ms + 60ms); }
    .sidebar { transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
    .side-overlay.open { animation: fadeIn .3s both; }
  }

  /* Progres & grafik */
  .first-load .progress span, .first-load .hbar-t span { transform-origin: left center; animation: growX 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: .2s; }
  @keyframes growX { from { transform: scaleX(0); } }

/* =========================================================
   SERTIFIKAT v2 – tipografi profesional, skala otomatis
   ========================================================= */
.cert-page { max-width: 1040px; margin: 0 auto; width: 100%; }
.cx-wrap { container-type: inline-size; width: 100%; }
.cx { position: relative; width: 100%; aspect-ratio: 297 / 210; overflow: hidden; font-size: 1cqw; color: #1F1A2E; background: #FFFDF7; box-shadow: 0 20px 60px rgba(31, 16, 70, .16); border-radius: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: 'Cormorant Garamond', Georgia, serif; }
.cx * { box-sizing: border-box; }
.cx-bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .9; }
.cx-wm { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: .045; font-family: 'Cinzel', serif; font-size: 22em; font-weight: 700; color: var(--cp); }

.cx-logo { height: 4.2em; width: auto; max-width: 16em; object-fit: contain; }
.cx-logo-mark { display: inline-grid; place-items: center; width: 4em; height: 4em; border-radius: 1em; background: var(--cp); color: #fff; font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1em; }
.cx-title { font-family: var(--tf), 'Cinzel', serif; color: var(--cp); text-transform: uppercase; letter-spacing: .16em; font-weight: 700; font-size: 5.2em; line-height: 1; }
.cx-sub { display: flex; align-items: center; justify-content: center; gap: 1.2em; margin-top: .9em; font-family: 'Cinzel', serif; letter-spacing: .32em; text-transform: uppercase; font-size: 1.15em; color: var(--ca); font-weight: 600; }
.cx-sub i { width: 7em; height: .1em; background: linear-gradient(90deg, transparent, var(--ca)); }
.cx-sub i:last-child { background: linear-gradient(90deg, var(--ca), transparent); }
.cx-intro { margin-top: 2.6em; font-style: italic; font-size: 1.75em; color: #5A5266; }
.cx-name { font-family: var(--nf), 'Great Vibes', cursive; font-size: 6.4em; line-height: 1.15; color: var(--cp); margin-top: .1em; padding: 0 .3em; white-space: nowrap; }
.cx-rule { display: flex; align-items: center; justify-content: center; gap: .8em; margin: .2em auto 0; }
.cx-rule i { width: 16em; height: .1em; background: linear-gradient(90deg, transparent, var(--ca)); }
.cx-rule i:last-child { background: linear-gradient(90deg, var(--ca), transparent); }
.cx-rule b { width: .8em; height: .8em; transform: rotate(45deg); background: var(--ca); }
.cx-text { margin-top: 1.4em; font-size: 1.75em; font-style: italic; color: #4A4358; }
.cx-prog { margin-top: .35em; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 3em; color: #17121F; line-height: 1.15; }
.cx-date { margin-top: .9em; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.15em; letter-spacing: .06em; color: #6B6478; }
.cx-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 2em; width: 100%; margin-top: auto; }
.cx-sign-col { position: relative; display: flex; justify-content: center; }
.cx-sign { display: flex; flex-direction: column; align-items: center; min-width: 20em; font-family: 'Plus Jakarta Sans', sans-serif; }

.cx-sign-space { height: 4.6em; }
.cx-sign b { display: block; width: 100%; text-align: center; border-top: .12em solid #2A2338; padding-top: .55em; font-size: 1.3em; font-weight: 700; color: #17121F; }

/* Klasik */
.tpl-classic, .tpl-minimal { text-align: center; }
.tpl-classic { background: radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #FFFDF7 55%, #F8F1E2 100%); }

.tpl-classic .cx-frame::before { content: ''; position: absolute; inset: 1.3em; border: .06em solid var(--ca); opacity: .6; }
.cx-corner { position: absolute; width: 9em; height: 9em; pointer-events: none; }

.cx-corner.bl { bottom: 3.6em; left: 3.6em; transform: scaleY(-1); } .cx-corner.br { bottom: 3.6em; right: 3.6em; transform: scale(-1, -1); }

.cx-main { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 5.5em 6em 3.6em 7em; text-align: left; }

.tpl-modern .cx-sub { justify-content: flex-start; margin-top: .6em; } .tpl-modern .cx-sub i { display: none; }
.tpl-modern .cx-name { padding: 0; }
.tpl-modern .cx-rule { justify-content: flex-start; margin-left: 0; } .tpl-modern .cx-rule i:first-child { display: none; }
.tpl-modern .cx-foot { display: flex; gap: 3em; justify-content: flex-start; }
.tpl-modern .cx-verify { justify-content: flex-start; }
.tpl-modern .cx-stamp { left: auto; right: 2em; margin: 0; }

/* Editor */

(function () {

  /* ---------- SHA-256 (sinkron, tanpa dependensi) ---------- */
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, max = mp(2, 32), result = '', words = [], i, j;
    var str = unescape(encodeURIComponent(ascii));
    var bitLen = str.length * 8;
    var hash = [], k = [], primeCounter = 0, isComposite = {};
    for (var c = 2; primeCounter < 64; c++) {
      if (!isComposite[c]) {
        for (i = 0; i < 313; i += c) isComposite[i] = c;
        hash[primeCounter] = (mp(c, .5) * max) | 0;
        k[primeCounter++] = (mp(c, 1 / 3) * max) | 0;
      }
    }
    hash = hash.slice(0, 8);
    str += '\x80';
    while (str.length % 64 - 56) str += '\x00';
    for (i = 0; i < str.length; i++) {
      j = str.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((bitLen / max) | 0);
    words[words.length] = (bitLen);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
    return result;
  }

      r.onerror = function () { rej(r.error); };

  }

      return fetch(API + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(id), {

    if (BADKEY) return Promise.reject(new Error('Kunci di js/config.js adalah SECRET / service_role key yang tidak boleh dipasang di website. Ganti dengan Publishable key (sb_publishable_…) atau anon key, lalu segera buat ulang (rotate) secret key tersebut di Supabase.'));
    if (ONLINE) return loadOnline();
    var site = window.SITE_DATA;
    try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { data = null; }
    // Jika ada site-data.js (hasil "Publikasikan Data") versi baru, gunakan sebagai data awal
    if (site && site.meta && site.meta.siteVersion && (!data || data.meta.siteVersion !== site.meta.siteVersion)) {
      var files = site.files || {};
      data = JSON.parse(JSON.stringify(site));
      delete data.files;
      save();
      Object.keys(files).forEach(function (fid) {
        fetch(files[fid]).then(function (r) { return r.blob(); }).then(function (b) { Files.put(b, fid); }).catch(function () { });
      });
      return Promise.resolve();
    }
    if (!data || !data.meta || data.meta.version !== 3) { data = seed(); save(); }
    if (!data.payments) data.payments = [];
    return Promise.resolve();
  }
  function save() {
    if (ONLINE) { scheduleSync(); return true; }
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) {
      if (window.UI) UI.toast('Penyimpanan browser penuh. Kurangi ukuran gambar atau hapus data lama.', 'error');
      return false;
    }
  }

  var DB = {
    sha256: sha256, hashPass: hashPass, uid: uid, Files: Files,
    online: ONLINE, needsInit: false,
    get data() { return data; },
    load: load, save: save, flush: flush, initOnline: initOnline,
    /* Muat ulang dari server bila data sudah lebih dari 30 detik */
    refreshIfStale: function () {
      if (!ONLINE || Date.now() - lastLoad < 30000) return Promise.resolve(false);
      var before = JSON.stringify(data);
      return flush().then(loadOnline).then(function () { return JSON.stringify(data) !== before; });
    },
    /* Muat ulang penuh dari server (mis. setelah pembayaran disetujui) */
    reload: function () { return ONLINE ? flush().then(loadOnline) : Promise.resolve(); },
    /* Status akses peserta ke program: none | pending | rejected | active */
    accessOf: function (uidv, pid) {
      var en = DB.enrollment(uidv, pid);
      if (!en) return 'none';
      if (en.status === 'pending_payment') return 'pending';
      if (en.status === 'payment_rejected') return 'rejected';
      return 'active';
    },
    /* Data siap-cetak untuk satu sertifikat (template: sertifikat > program > umum) */
    certData: function (c) {
      var u = DB.find('users', c.userId), p = DB.find('programs', c.programId);
      return { name: u ? u.name : '', program: p ? p.title : '', number: c.number, code: c.code, issuedAt: c.issuedAt,
        template: c.template || (p && p.certTemplate) || null,
        verifyUrl: location.href.split('#')[0] + '#/verify?code=' + encodeURIComponent(c.code) };
    },
    isPaid: function (p) { return !!p && p.isFree === false; },
    /* Link grup WhatsApp: kelas (batch) > program */
    waLink: function (p, classId) { var k = classId ? DB.find('classes', classId) : null; return (k && k.waGroup) || (p && p.waGroup) || ''; },
    /* Link Google Form: kelas (batch) > program → {url, label} */
    formLink: function (p, classId) {
      var k = classId ? DB.find('classes', classId) : null;
      if (k && k.gformLink) return { url: k.gformLink, label: k.gformLabel || (p && p.gformLabel) || 'Formulir Peserta' };
      if (p && p.gformLink) return { url: p.gformLink, label: p.gformLabel || 'Formulir Peserta' };
      return null;
    },
    verify: function (code) { return Cloud.rpc('lms_verify', { p_code: code }); },
    classCount: function (kid) {
      var local = data.enrollments.filter(function (e) { return e.classId === kid; }).length;
      return ONLINE && stats.classCounts ? Math.max(local, Number(stats.classCounts[kid] || 0)) : local;
    },
    bumpClass: function (kid) { if (stats.classCounts) stats.classCounts[kid] = Number(stats.classCounts[kid] || 0) + 1; },
    countLearners: function () { var n = data.users.filter(function (u) { return u.role === 'learner'; }).length; return ONLINE && stats.learners != null ? Math.max(n, stats.learners) : n; },
    countCertificates: function () { var n = data.certificates.length; return ONLINE && stats.certificates != null ? Math.max(n, stats.certificates) : n; },
    reset: function () { data = seed(); save(); return Files.clear(); },
    replaceAll: function (obj) { data = obj; save(); },
    all: function (t) { return data[t] || []; },
    find: function (t, id) { return (data[t] || []).find(function (x) { return x.id === id; }) || null; },
    where: function (t, fn) { return (data[t] || []).filter(fn); },
    insert: function (t, obj) { if (!obj.id) obj.id = uid(t.slice(0, 2)); data[t].push(obj); save(); return obj; },
    update: function (t, id, patch) { var o = DB.find(t, id); if (o) { Object.assign(o, patch); save(); } return o; },
    remove: function (t, id) { data[t] = data[t].filter(function (x) { return x.id !== id; }); save(); },
    settings: function () { return data.settings; },
    setSettings: function (patch) { Object.assign(data.settings, patch); save(); },

    /* --- Aktivitas & notifikasi --- */
    log: function (action, entity) {
      var u = Auth.user();
      data.logs.unshift({ id: uid('lg'), userId: u ? u.id : null, action: action, entity: entity || '', date: nowISO() });
      if (data.logs.length > 400) data.logs.length = 400;
      save();
    },
    notify: function (userId, text, link) {
      data.notifications.unshift({ id: uid('n'), userId: userId, text: text, link: link || '', read: false, date: nowISO() });
      save();
    },
    notifyRole: function (roles, text, link) {
      data.users.filter(function (u) { return roles.indexOf(u.role) > -1; }).forEach(function (u) { DB.notify(u.id, text, link); });
    },

    /* --- Query pembelajaran --- */
    modulesOf: function (pid) { return data.modules.filter(function (m) { return m.programId === pid; }).sort(function (a, b) { return a.order - b.order; }); },
    lessonsOf: function (mid, all) { return data.lessons.filter(function (l) { return l.moduleId === mid && (all || l.published); }).sort(function (a, b) { return a.order - b.order; }); },
    programLessons: function (pid, all) { var out = []; DB.modulesOf(pid).forEach(function (m) { out = out.concat(DB.lessonsOf(m.id, all)); }); return out; },
    assessmentsOf: function (pid, all) { return data.assessments.filter(function (a) { return a.programId === pid && (all || a.published); }); },

    enrollment: function (uidv, pid) { return data.enrollments.find(function (e) { return e.userId === uidv && e.programId === pid; }) || null; },

      var at = data.attempts.filter(function (x) { return x.userId === uidv && x.assessmentId === aid; });

    attemptsCount: function (uidv, aid) {
      return data.attempts.filter(function (x) { return x.userId === uidv && x.assessmentId === aid; }).length +

    },
    lastSubmission: function (uidv, aid) {

    /* Status satu assessment untuk peserta: {done, passed, score, pending} */
    assessmentStatus: function (uidv, a) {
      if (a.source === 'builtin' && a.type !== 'assignment') {
        var b = DB.bestAttempt(uidv, a.id);
        if (!b) return { done: false, passed: false, score: null };
        return { done: true, passed: b.score >= (a.passingScore || 0), score: b.score };
      }
      var subs = data.submissions.filter(function (x) { return x.userId === uidv && x.assessmentId === a.id; });
      if (!subs.length) return { done: false, passed: false, score: null };
      var graded = subs.filter(function (s) { return s.status === 'graded'; });
      if (!graded.length) return { done: true, passed: false, score: null, pending: true };
      var best = graded.reduce(function (x, y) { return (y.score || 0) > (x.score || 0) ? y : x; });

    checkCompletion: function (uidv, pid) {

    login: function (identity, password, remember) {
      if (ONLINE) {
        return Cloud.rpc('lms_login', { p_identity: identity, p_hash: hashPass(password) }).then(function (res) {

          setToken(res.token, remember);
          return loadOnline().then(function () { DB.log('Login', 'auth'); return { ok: true, user: Auth.user() }; });
        }).catch(function (e) { return { ok: false, msg: e.message }; });
      }
      identity = (identity || '').trim().toLowerCase();
      var u = data.users.find(function (x) { return x.username.toLowerCase() === identity || x.email.toLowerCase() === identity; });
      if (!u || u.passHash !== hashPass(password)) return Promise.resolve({ ok: false, msg: 'Username/email atau kata sandi salah.' });
      if (u.status !== 'active') return Promise.resolve({ ok: false, msg: 'Akun Anda sedang dinonaktifkan. Hubungi admin.' });
      sessionStorage.setItem(SESSION, u.id);
      if (remember) localStorage.setItem(SESSION, u.id); else localStorage.removeItem(SESSION);
      u.lastLogin = nowISO(); save();
      DB.log('Login', 'auth');
      return Promise.resolve({ ok: true, user: u });

    logout: function () {
      DB.log('Logout', 'auth');
      if (ONLINE) {
        var t = getToken();
        return flush().then(function () { return Cloud.rpc('lms_logout', { p_token: t }).catch(function () { }); })
          .then(function () { clearToken(); meId = null; return loadOnline(); });
      }
      sessionStorage.removeItem(SESSION); localStorage.removeItem(SESSION);
      return Promise.resolve();
    },
    register: function (f) {
      var welcome = function (u) {
        DB.log('Registrasi akun peserta baru: ' + u.name, 'user');
        DB.notify(u.id, 'Selamat datang, ' + u.name + '! Jelajahi program pelatihan dan mulai belajar.', '#/programs');
        DB.notifyRole(['admin'], 'Peserta baru terdaftar: ' + u.name, '#/admin/users');
        return { ok: true, user: u };

            setToken(res.token, true);
            return loadOnline().then(function () { return welcome(Auth.user()); });
          }).catch(function (e) { return { ok: false, msg: e.message }; });
      }
      var exists = data.users.some(function (x) { return x.email.toLowerCase() === f.email.toLowerCase() || x.username.toLowerCase() === f.username.toLowerCase(); });
      if (exists) return Promise.resolve({ ok: false, msg: 'Email atau username sudah terdaftar.' });
      var u = { id: uid('u'), username: f.username, name: f.name, email: f.email, phone: f.phone || '', role: 'learner', passHash: hashPass(f.password), status: 'active', createdAt: nowISO(), bio: f.business || '', expertise: '', avatar: null };
      data.users.push(u); save();

    changePassword: function (oldPw, newPw) {
      if (ONLINE) {
        return Cloud.rpc('lms_change_password', { p_token: getToken(), p_old: hashPass(oldPw), p_new: hashPass(newPw) })

      if (hashPass(oldPw) !== u.passHash) return Promise.resolve({ ok: false, msg: 'Kata sandi saat ini salah.' });

  };

  window.DB = DB;
  window.Auth = Auth;
  window.ROLES = {
    learner: 'Learner', trainer: 'Trainer Internal', coach: 'Enterprise Coach', admin: 'Administrator System', executive: 'Executive Viewer'
  };
})();

  /* ---------- Form builder ----------
     fields: [{name,label,type,value,options:[[v,l]],required,help,placeholder,accept,rows,min,max,show:fn(values)}] */
  function fieldHTML(f) {
    var id = 'f_' + f.name, v = f.value == null ? '' : f.value, req = f.required ? ' required' : '';
    var lab = '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>';
    var help = f.help ? '<small class="help">' + esc(f.help) + '</small>' : '';
    var inp;
    switch (f.type) {
      case 'textarea': inp = '<textarea id="' + id + '" name="' + f.name + '" rows="' + (f.rows || 4) + '"' + req + ' placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>'; break;
      case 'select': inp = '<select id="' + id + '" name="' + f.name + '"' + req + '>' + (f.options || []).map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; break;
      case 'checkbox': return '<div class="field check" data-field="' + f.name + '"><label><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>' + help + '</div>';
      case 'file': inp = '<input type="file" id="' + id + '" name="' + f.name + '" accept="' + esc(f.accept || '') + '"' + req + '>' + (f.current ? '<small class="help">File saat ini: ' + esc(f.current) + '</small>' : ''); break;
      case 'html': return '<div class="field' + (f.full !== false ? ' full' : '') + '" data-field="' + f.name + '" style="grid-column:' + (f.full !== false ? '1 / -1' : 'auto') + '">' + f.html + '</div>';
      default: inp = '<input type="' + (f.type || 'text') + '" id="' + id + '" name="' + f.name + '" value="' + esc(v) + '"' + req + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + (f.minlength ? ' minlength="' + f.minlength + '"' : '') + ' placeholder="' + esc(f.placeholder || '') + '"' + (f.type === 'password' ? ' autocomplete="new-password"' : '') + '>';
    }
    return '<div class="field' + (f.full ? ' full' : '') + '" data-field="' + f.name + '">' + lab + inp + help + '<small class="err"></small></div>';
  }
  function readForm(form, fields) {
    var vals = {};
    fields.forEach(function (f) {
      var el = form.querySelector('[name="' + f.name + '"]'); if (!el) return;
      if (f.type === 'checkbox') vals[f.name] = el.checked;
      else if (f.type === 'file') vals[f.name] = el.files && el.files[0] ? el.files[0] : null;
      else if (f.type === 'number') vals[f.name] = el.value === '' ? null : Number(el.value);
      else vals[f.name] = el.value.trim();
    });
    return vals;
  }
  function applyShow(form, fields) {
    var vals = readForm(form, fields);
    fields.forEach(function (f) {
      if (!f.show) return;

      var vis = f.show(vals);
      if (box) { box.style.display = vis ? '' : 'none'; $$('input,select,textarea', box).forEach(function (i) { if (f.required) i.required = vis; }); }
    });
  }
  function formModal(opts) {
    var fields = opts.fields;

      title: opts.title, size: opts.size || '',

      footer: '<button class="btn btn-ghost" data-close type="button">Batal</button><button class="btn btn-primary" id="mform-save" type="button">' + esc(opts.submitLabel || 'Simpan') + '</button>',
      onOpen: function (w) {
        var form = w.querySelector('#mform');
        form.addEventListener('change', function () { applyShow(form, fields); });
        applyShow(form, fields);
        var submit = function () {
          var ok = true;
          $$('.field', form).forEach(function (b) { b.classList.remove('invalid'); var e = b.querySelector('.err'); if (e) e.textContent = ''; });
          $$('input,select,textarea', form).forEach(function (el) {
            if (el.closest('[data-field]') && el.closest('[data-field]').style.display === 'none') return;
            if (!el.checkValidity()) {
              ok = false; var b = el.closest('.field'); b.classList.add('invalid');
              var e = b.querySelector('.err'); if (e) e.textContent = el.validationMessage || 'Wajib diisi.';
            }

          var vals = readForm(form, fields);
          var btn = w.querySelector('#mform-save'); btn.disabled = true; btn.textContent = 'Menyimpan…';
          Promise.resolve(opts.onSubmit(vals, form)).then(function (res) {

            closeModal();

  /* ---------- Gambar: baca & perkecil ---------- */
  function readImage(file, maxW, type) {
    return new Promise(function (res, rej) {
      if (!file) return res(null);
      if (!/^image\//.test(file.type)) return rej(new Error('File harus berupa gambar (PNG, JPG, SVG, WEBP).'));
      if (file.size > 5 * 1024 * 1024) return rej(new Error('Ukuran gambar maksimal 5 MB.'));
      var fr = new FileReader();
      fr.onload = function () {
        if (file.type === 'image/svg+xml') return res(fr.result);
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height, s = Math.min(1, (maxW || 800) / w);
          var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL(type || (file.type === 'image/png' ? 'image/png' : 'image/jpeg'), 0.85));
        };
        img.onerror = function () { rej(new Error('Gambar tidak dapat dibaca.')); };
        img.src = fr.result;
      };
      fr.onerror = function () { rej(new Error('Gagal membaca file.')); };
      fr.readAsDataURL(file);
    });
  }
  /* Simpan file PDF/dokumen ke IndexedDB dengan validasi */
  function storeFile(file, opts) {
    opts = opts || {};

    if (opts.pdfOnly && file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) return Promise.reject(new Error('File harus berformat PDF.'));
    if (file.size > max) return Promise.reject(new Error('Ukuran file maksimal ' + (opts.maxMB || 15) + ' MB.'));
    return DB.Files.put(file).then(function (id) { return { id: id, name: file.name, size: file.size }; });
  }
  function openStoredFile(fileId, fileName, download) {
    DB.Files.get(fileId).then(function (blob) {

      if (download) a.download = fileName || 'file';
      document.body.appendChild(a); a.click(); a.remove();

    }).catch(function () { toast('Gagal membuka file.', 'error'); });
  }

  /* ---------- Grafik sederhana (SVG) ---------- */
  function barChart(items, opts) {

    return '<div class="hbars">' + items.map(function (i) {

    }).join('') + '</div>';
  }
  function lineChart(labels, series, opts) {
    opts = opts || {};

    var max = Math.max(1, Math.max.apply(null, all)); max = Math.ceil(max / 5) * 5 || 5;
    var x = function (i) { return pl + (labels.length < 2 ? 0 : i * (W - pl - pr) / (labels.length - 1)); };
    var y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var grid = '';
    for (var g = 0; g <= 4; g++) { var gv = max * g / 4, gy = y(gv); grid += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '" class="grid"/><text x="' + (pl - 8) + '" y="' + (gy + 4) + '" text-anchor="end" class="axis">' + Math.round(gv) + '</text>'; }

  }
