    var s = DB.settings();
    return '<div class="auth"><div class="auth-side">' + UI.logoHTML(s, true) + '<div><div class="eyebrow" style="color:#C4B5FD">' + esc(s.tagline) + '</div><h2>Belajar keterampilan praktis untuk usaha dan karier Anda.</h2><p>Materi terstruktur, latihan langsung, feedback trainer, dan e-sertifikat — semuanya dalam satu platform.</p></div><small style="color:#8F88A6">© ' + new Date().getFullYear() + ' ' + esc(s.siteName) + '</small></div>' +
      '<div class="auth-form"><div class="auth-box">' + form + '</div></div></div>';
  }

  Pages.login = function (params, q) {
    if (Auth.user()) return (location.hash = '#/dashboard');
    var html = authShell('<a href="#/" class="muted" style="font-size:.88rem">← Kembali ke beranda</a><h1 class="mt">Masuk ke akun Anda</h1><p class="muted">Gunakan username atau email yang terdaftar.</p>' +
      '<form id="lf" class="form-1" novalidate>' + UI.fieldHTML({ name: 'identity', label: 'Username atau Email', required: true, placeholder: 'Username atau email Anda' }) +
      '<div class="field" data-field="password"><label for="f_password">Kata sandi <span class="req">*</span></label><div style="position:relative"><input type="password" id="f_password" name="password" required autocomplete="current-password"><button type="button" class="icon-btn" id="togglepw" aria-label="Tampilkan kata sandi" style="position:absolute;right:2px;top:1px">' + icon('eye') + '</button></div><small class="err"></small></div>' +
      '<div class="row between"><label class="row" style="gap:.4rem;font-size:.88rem"><input type="checkbox" name="remember"> Ingat saya</label><a href="#/forgot" style="font-size:.88rem">Lupa kata sandi?</a></div>' +
      '<div id="lerr" class="err" role="alert"></div><button class="btn btn-primary btn-lg">Masuk</button></form>' +
      '<p class="center mt">Belum punya akun? <a href="#/register"><b>Daftar sebagai peserta</b></a></p>');
    App.render(html);
    var f = UI.$('#lf');
    UI.$('#togglepw').onclick = function () { var i = UI.$('#f_password'); i.type = i.type === 'password' ? 'text' : 'password'; };
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!f.identity.value.trim() || !f.password.value) { UI.$('#lerr').textContent = 'Username dan kata sandi wajib diisi.'; return; }
      var btn = f.querySelector('button.btn-primary'); btn.disabled = true; btn.textContent = 'Memproses…';
      Auth.login(f.identity.value, f.password.value, f.remember.checked).then(function (r) {
        btn.disabled = false; btn.textContent = 'Masuk';
        if (!r.ok) { UI.$('#lerr').textContent = r.msg; return; }
        UI.toast('Selamat datang, ' + r.user.name + '!');
        location.hash = q.next ? decodeURIComponent(q.next) : '#/dashboard';
      });
    });
  };

  Pages.register = function () {
    if (Auth.user()) return (location.hash = '#/dashboard');
    var s = DB.settings();
    if (s.allowRegistration === false) {
      return App.render(authShell('<h1>Pendaftaran ditutup</h1><p class="muted">Pendaftaran akun baru sedang ditutup sementara oleh admin. Silakan hubungi ' + esc(s.email) + '.</p><a href="#/login" class="btn btn-primary">Masuk</a>'));
    }
    var fields = [
      { name: 'name', label: 'Nama lengkap', required: true, full: true },
      { name: 'username', label: 'Username', required: true, help: 'Huruf, angka, titik, atau garis bawah (3–20 karakter).' },
      { name: 'phone', label: 'No. WhatsApp', type: 'tel', placeholder: '08xxxxxxxxxx' },
      { name: 'email', label: 'Email', type: 'email', required: true, full: true },
      { name: 'business', label: 'Nama usaha / pekerjaan (opsional)', full: true },
      { name: 'password', label: 'Kata sandi', type: 'password', required: true, minlength: 8, help: 'Minimal 8 karakter, mengandung huruf dan angka.' },
      { name: 'password2', label: 'Ulangi kata sandi', type: 'password', required: true },
      { name: 'agree', label: 'Saya menyetujui Ketentuan Penggunaan dan Kebijakan Privasi', type: 'checkbox' }
    ];
    App.render(authShell('<a href="#/" class="muted" style="font-size:.88rem">← Kembali ke beranda</a><h1 class="mt">Buat akun peserta</h1><p class="muted">Gratis. Setelah mendaftar, Anda bisa langsung mengikuti kelas.</p>' +
      '<form id="rf" class="form-grid" novalidate>' + fields.map(UI.fieldHTML).join('') + '<div class="field full"><div id="rerr" class="err" role="alert"></div><button class="btn btn-primary btn-lg">Daftar Sekarang</button></div></form>' +
      '<p class="center mt">Sudah punya akun? <a href="#/login"><b>Masuk</b></a></p>'));
    var f = UI.$('#rf');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = UI.readForm(f, fields), errs = {};
      if (!v.name) errs.name = 'Nama wajib diisi.';
      if (!/^[A-Za-z0-9._]{3,20}$/.test(v.username)) errs.username = 'Username 3–20 karakter (huruf, angka, titik, garis bawah).';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) errs.email = 'Format email tidak valid.';
      if (v.phone && !/^[0-9+\s-]{8,16}$/.test(v.phone)) errs.phone = 'Nomor telepon tidak valid.';
      if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(v.password)) errs.password = 'Minimal 8 karakter dengan huruf dan angka.';
      if (v.password !== v.password2) errs.password2 = 'Kata sandi tidak sama.';
      if (!v.agree) errs.agree = 'Anda perlu menyetujui ketentuan.';
      UI.$$('.field', f).forEach(function (b) { b.classList.remove('invalid'); var x = b.querySelector('.err'); if (x) x.textContent = ''; });
      Object.keys(errs).forEach(function (k) { var b = f.querySelector('[data-field="' + k + '"]'); if (b) { b.classList.add('invalid'); var x = b.querySelector('.err'); if (x) x.textContent = errs[k]; else UI.$('#rerr').textContent = errs[k]; } });
      if (Object.keys(errs).length) return;
      var btn = f.querySelector('button.btn-primary'); btn.disabled = true; btn.textContent = 'Memproses…';
      Auth.register(v).then(function (r) {
        btn.disabled = false; btn.textContent = 'Daftar Sekarang';
        if (!r.ok) { UI.$('#rerr').textContent = r.msg; return; }
        UI.toast('Akun berhasil dibuat. Selamat datang!');
        location.hash = '#/dashboard';
      });
    });
  };

  Pages.forgot = function () {
    if (DB.online) {
      var st = DB.settings();
      return App.render(authShell('<a href="#/login" class="muted" style="font-size:.88rem">← Kembali ke halaman masuk</a><h1 class="mt">Lupa kata sandi?</h1><p class="muted">Demi keamanan, kata sandi diatur ulang oleh Administrator.</p><div class="notice">' + icon('mail', 16) + ' Hubungi admin melalui <a href="mailto:' + esc(st.email) + '?subject=Reset%20kata%20sandi">' + esc(st.email) + '</a>' + (st.whatsapp ? ' atau <a target="_blank" rel="noopener" href="https://wa.me/' + esc(String(st.whatsapp).replace(/\D/g, '')) + '">WhatsApp</a>' : '') + ' dengan menyebutkan username dan email akun Anda. Admin dapat membuat kata sandi baru melalui menu Pengguna & Role.</div>'));
    }
    App.render(authShell('<a href="#/login" class="muted" style="font-size:.88rem">← Kembali ke halaman masuk</a><h1 class="mt">Pulihkan kata sandi</h1><p class="muted">Masukkan email akun Anda. Kami akan mengirimkan kode pemulihan.</p>' +
      '<form id="ff" class="form-1" novalidate>' + UI.fieldHTML({ name: 'email', label: 'Email', type: 'email', required: true }) + '<div id="ferr" class="err"></div><button class="btn btn-primary">Kirim Kode</button></form><div id="step2"></div>'));
    UI.$('#ff').onsubmit = function (e) {
      e.preventDefault();
      var email = e.target.email.value.trim().toLowerCase();
      var u = DB.all('users').find(function (x) { return x.email.toLowerCase() === email; });
      if (!u) { UI.$('#ferr').textContent = 'Email tidak terdaftar.'; return; }
      var code = String(Math.floor(100000 + Math.random() * 900000));
      DB.data.resets = (DB.data.resets || []).filter(function (r) { return r.userId !== u.id; });
      DB.data.resets.push({ userId: u.id, code: DB.hashPass(code), exp: Date.now() + 15 * 60000 }); DB.save();
      UI.$('#step2').innerHTML = '<div class="notice mt">' + icon('mail', 16) + ' <b>Mode prototype:</b> email tidak benar-benar dikirim. Kode pemulihan Anda: <b style="font-size:1.1rem;letter-spacing:.1em">' + code + '</b> (berlaku 15 menit)</div>' +
        '<form id="ff2" class="form-1 mt" novalidate>' + UI.fieldHTML({ name: 'code', label: 'Kode pemulihan', required: true }) + UI.fieldHTML({ name: 'pw', label: 'Kata sandi baru', type: 'password', required: true }) + '<div id="ferr2" class="err"></div><button class="btn btn-primary">Simpan Kata Sandi Baru</button></form>';
      UI.$('#ff2').onsubmit = function (ev) {
        ev.preventDefault();
        var r = (DB.data.resets || []).find(function (x) { return x.userId === u.id; });
        if (!r || r.exp < Date.now() || r.code !== DB.hashPass(ev.target.code.value.trim())) { UI.$('#ferr2').textContent = 'Kode salah atau kedaluwarsa.'; return; }
        if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(ev.target.pw.value)) { UI.$('#ferr2').textContent = 'Kata sandi minimal 8 karakter dengan huruf dan angka.'; return; }
        u.passHash = DB.hashPass(ev.target.pw.value);
        DB.data.resets = DB.data.resets.filter(function (x) { return x.userId !== u.id; }); DB.save();
        DB.log('Reset kata sandi akun ' + u.username, 'auth');
        UI.toast('Kata sandi berhasil diperbarui. Silakan masuk.');
        location.hash = '#/login';
      };
    };
  };
})();

</script>
  <script>/* ==== pages-learner.js ==== */
/* =========================================================
   Area peserta (Learner) + halaman umum setelah login
   ========================================================= */
(function () {
  'use strict';
  var Pages = window.Pages;
  var esc = UI.esc, icon = UI.icon;
  var TYPE_LABEL = { pretest: 'Pretest', quiz: 'Kuis', posttest: 'Post-test', assignment: 'Tugas Praktik' };
  var SRC_LABEL = { builtin: 'Soal di platform', link: 'Tautan eksternal', pdf: 'File PDF' };
  Pages.TYPE_LABEL = TYPE_LABEL; Pages.SRC_LABEL = SRC_LABEL;
  /* Pesan peringatan program (tampil setelah mendaftar) */
  Pages.programNotice = function (p, en) {
    if (!p || !p.notice || !en) return '';
    var ack = !!en.noticeAck;
    return '<div class="notice-warn' + (ack ? ' ack' : '') + '" role="alert"><div class="nw-ic">' + icon('bell', 20) + '</div><div class="grow"><b>Perhatian untuk peserta</b><div class="prose">' + UI.md(p.notice) + '</div></div>' +
      (ack ? '' : '<button class="btn btn-dark btn-sm" data-ack="' + UI.esc(en.id) + '">' + icon('check', 14) + ' Saya mengerti</button>') + '</div>';
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ack]'); if (!b) return;
    var en = DB.find('enrollments', b.dataset.ack); if (!en) return;
    en.noticeAck = true; DB.save(); UI.toast('Terima kasih, pesan sudah dibaca.'); App.refresh();
  });
  Pages.gfIcon = function (n) { return '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><circle cx="8.5" cy="13" r=".6" fill="currentColor"/><path d="M11 13h5"/><circle cx="8.5" cy="17" r=".6" fill="currentColor"/><path d="M11 17h5"/></svg>'; };
  Pages.waIcon = function (n) { return '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 001.8-1.3 2.3 2.3 0 00.2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>'; };

  function me() { return Auth.user(); }
  function myEnrollments(u) { return DB.where('enrollments', function (e) { return e.userId === u.id; }); }
  function upcomingSessions(classIds) {
    var out = [];
    DB.all('classes').forEach(function (k) {
      if (classIds && classIds.indexOf(k.id) === -1) return;
      (k.sessions || []).forEach(function (s) { if (new Date(s.at) >= new Date(Date.now() - 3600e3)) out.push({ cls: k, s: s }); });
    });
    return out.sort(function (a, b) { return new Date(a.s.at) - new Date(b.s.at); });
  }
  Pages.upcomingSessions = upcomingSessions;
  function sessionList(items) {
    if (!items.length) return UI.empty('Tidak ada jadwal sesi dalam waktu dekat.');
    return '<div class="list">' + items.slice(0, 5).map(function (x) {
      var p = DB.find('programs', x.cls.programId);
      return '<div class="list-item"><div class="li-ic">' + icon('cal') + '</div><div class="li-b"><b>' + esc(x.s.title) + '</b><small>' + esc(p ? p.title : '') + ' • ' + esc(x.cls.name) + '</small></div><div style="text-align:right"><b style="font-size:.85rem">' + UI.fmtDate(x.s.at, true) + '</b>' +
        (x.cls.meetingLink ? '<br><a href="' + UI.safeUrl(x.cls.meetingLink) + '" target="_blank" rel="noopener" style="font-size:.8rem">Buka link ' + icon('arrow', 12) + '</a>' : '<br><small class="muted">' + esc(x.cls.location || '') + '</small>') + '</div></div>';
    }).join('') + '</div>';
  }
  Pages.sessionList = sessionList;

  /* ---------- Dispatcher dashboard ---------- */
  Pages.dashboard = function (p, q) {
    var r = me().role;
    ({ learner: Pages.dashLearner, trainer: Pages.dashTrainer, coach: Pages.dashCoach, admin: Pages.dashAdmin, executive: Pages.dashExecutive }[r])(p, q);
  };

  /* ---------- Dashboard Learner ---------- */
  Pages.dashLearner = function () {
    var u = me(), ens = myEnrollments(u);
    var progs = ens.map(function (e) { return { e: e, p: DB.find('programs', e.programId), pr: DB.programProgress(u.id, e.programId) }; }).filter(function (x) { return x.p; });
    var active = progs.filter(function (x) { return x.pr < 100 && DB.accessOf(u.id, x.p.id) === 'active'; });
    var last = active[0] || progs.filter(function (x) { return DB.accessOf(u.id, x.p.id) === 'active'; })[0];
    var certs = DB.where('certificates', function (c) { return c.userId === u.id; });
    var attempts = DB.where('attempts', function (a) { return a.userId === u.id; }).slice(-5).reverse();
    var subs = DB.where('submissions', function (s) { return s.userId === u.id && s.status === 'graded'; }).slice(-3).reverse();
    var avg = progs.length ? Math.round(progs.reduce(function (s, x) { return s + x.pr; }, 0) / progs.length) : 0;
    var enrolledPids = ens.map(function (e) { return e.programId; });
    var cats = progs.map(function (x) { return x.p.categoryId; });
    var rec = DB.where('programs', function (p) { return p.status === 'published' && enrolledPids.indexOf(p.id) === -1; })
      .sort(function (a, b) { return (cats.indexOf(b.categoryId) > -1) - (cats.indexOf(a.categoryId) > -1); }).slice(0, 3);

    var nextLesson = null;
    if (last) { nextLesson = DB.programLessons(last.p.id).find(function (l) { return !DB.isDone(u.id, l.id); }); }

    var html = '<div class="welcome"><div><h2>Halo, ' + esc(u.name.split(' ')[0]) + '! 👋</h2><p>' + (progs.length ? 'Anda mengikuti ' + progs.length + ' program. Rata-rata progres ' + avg + '%. Terus semangat!' : 'Anda belum mengikuti kelas apa pun. Yuk mulai belajar!') + '</p></div>' +
      (last ? '<a class="btn btn-primary btn-lg" href="#/learn/' + esc(last.p.id) + (nextLesson ? '/' + esc(nextLesson.id) : '') + '">' + icon('play', 16) + ' Lanjutkan Belajar</a>' : '<a class="btn btn-primary btn-lg" href="#/programs">Jelajahi Program</a>') + '</div>' +
      '<div class="stats">' + UI.stat('Kelas diikuti', progs.length, 'book') + UI.stat('Rata-rata progres', avg + '%', 'chart') + UI.stat('Kuis dikerjakan', DB.where('attempts', function (a) { return a.userId === u.id; }).length, 'quiz') + UI.stat('Sertifikat', certs.length, 'award') + '</div>' +
      '<div class="grid-21"><div class="card"><div class="card-title"><h3>Kelas Saya</h3><a href="#/my-learning" class="btn btn-ghost btn-sm">Lihat semua</a></div>' +
      (progs.length ? '<div class="list">' + progs.map(function (x) {
        var k = DB.find('classes', x.e.classId), acc = DB.accessOf(u.id, x.p.id);
        if (acc === 'pending' || acc === 'rejected') return '<div class="list-item"><div class="li-ic">' + icon('wallet') + '</div><div class="li-b"><b>' + esc(x.p.title) + '</b><small>' + esc(k ? k.name : '') + '</small></div>' + (acc === 'pending' ? UI.badge('Menunggu verifikasi', 'amber') : UI.badge('Pembayaran ditolak', 'red')) + '<a class="btn btn-soft btn-sm" href="#/learn/' + esc(x.p.id) + '">Status</a></div>';
        return '<div class="list-item"><div class="li-ic">' + icon('book') + '</div><div class="li-b"><b>' + esc(x.p.title) + '</b><small>' + esc(k ? k.name : '') + '</small>' + UI.progressBar(x.pr, 'Progres ' + x.p.title) + '</div><div class="row"><b>' + x.pr + '%</b><a class="btn btn-soft btn-sm" href="#/learn/' + esc(x.p.id) + '">Buka</a></div></div>';
      }).join('') + '</div>' : UI.empty('Belum ada kelas.', '<a class="btn btn-primary btn-sm" href="#/programs">Cari program</a>')) + '</div>' +
      '<div class="card"><div class="card-title"><h3>Jadwal Mendatang</h3></div>' + sessionList(upcomingSessions(ens.map(function (e) { return e.classId; }))) + '</div></div>' +
      '<div class="grid2"><div class="card"><div class="card-title"><h3>Hasil Assessment Terbaru</h3><a href="#/results" class="btn btn-ghost btn-sm">Detail</a></div>' +
      ((attempts.length || subs.length) ? '<div class="list">' + attempts.map(function (a) {
        var as = DB.find('assessments', a.assessmentId); if (!as) return '';
        var pass = a.score >= (as.passingScore || 0);
        return '<div class="list-item"><div class="li-ic">' + icon('quiz') + '</div><div class="li-b"><b>' + esc(as.title) + '</b><small>' + UI.fmtDate(a.submittedAt, true) + '</small></div><b>' + a.score + '</b>' + UI.badge(pass ? 'Lulus' : 'Belum lulus', pass ? 'green' : 'red') + '</div>';
      }).join('') + subs.map(function (s) {
        var as = DB.find('assessments', s.assessmentId); if (!as) return '';
        return '<div class="list-item"><div class="li-ic">' + icon('task') + '</div><div class="li-b"><b>' + esc(as.title) + '</b><small>Feedback: ' + esc(s.feedback || '-') + '</small></div><b>' + s.score + '</b></div>';
      }).join('') + '</div>' : UI.empty('Belum ada hasil assessment.')) + '</div>' +
      '<div class="card"><div class="card-title"><h3>Sertifikat Saya</h3><a href="#/certificates" class="btn btn-ghost btn-sm">Lihat semua</a></div>' +
      (certs.length ? '<div class="list">' + certs.map(function (c) { var p = DB.find('programs', c.programId); return '<div class="list-item"><div class="li-ic">' + icon('award') + '</div><div class="li-b"><b>' + esc(p ? p.title : '') + '</b><small>' + esc(c.number) + '</small></div><a class="btn btn-soft btn-sm" href="#/certificate/' + esc(c.id) + '">Lihat</a></div>'; }).join('') + '</div>' : UI.empty('Selesaikan program untuk mendapatkan sertifikat.')) + '</div></div>' +
      (rec.length ? '<div><h3>Rekomendasi Program</h3><div class="cards">' + rec.map(Pages.programCard).join('') + '</div></div>' : '');
    App.render(UI.appLayout(html, { title: 'Dashboard Peserta', subtitle: UI.fmtDate(new Date().toISOString()) }));
  };

  /* ---------- Kelas Saya ---------- */
  Pages.myLearning = function () {
    var u = me(), ens = myEnrollments(u);
    var html = ens.length ? '<div class="cards">' + ens.map(function (e) {
      var p = DB.find('programs', e.programId); if (!p) return '';
      var k = DB.find('classes', e.classId), pr = DB.programProgress(u.id, p.id), c = DB.certificateOf(u.id, p.id);
      var acc = DB.accessOf(u.id, p.id);
      if (acc === 'pending' || acc === 'rejected') return '<div class="card pcard">' + UI.programThumb(p) + '<div class="pc-body"><div class="row">' + (acc === 'pending' ? UI.badge('Menunggu verifikasi pembayaran', 'amber') : UI.badge('Pembayaran ditolak', 'red')) + (p.notice && !e.noticeAck ? UI.badge('⚠ Ada pesan penting', 'amber') : '') + '</div><h3>' + esc(p.title) + '</h3><p>' + esc(k ? k.name : '') + ' • ' + esc(UI.priceLabel(p)) + '</p><a class="btn btn-primary btn-sm mt" href="#/learn/' + esc(p.id) + '">' + icon('wallet', 14) + ' ' + (acc === 'pending' ? 'Lihat Status Pembayaran' : 'Kirim Ulang Bukti') + '</a></div></div>';
      return '<div class="card pcard">' + UI.programThumb(p) + '<div class="pc-body"><div class="row">' + (c ? UI.badge('Selesai', 'green') : UI.badge('Sedang berjalan', 'purple')) + (p.notice && !e.noticeAck ? UI.badge('⚠ Ada pesan penting', 'amber') : '') + '</div><h3>' + esc(p.title) + '</h3><p>' + esc(k ? k.name + ' • ' + k.mode : '') + '</p>' +

      '<h3 class="mt2">Info akun</h3><dl class="kv"><dt>Bergabung</dt><dd>' + UI.fmtDate(u.createdAt) + '</dd><dt>Login terakhir</dt><dd>' + UI.fmtDate(u.lastLogin, true) + '</dd><dt>Status</dt><dd>' + UI.statusBadge(u.status) + '</dd></dl></div></div>';

        if (!r.ok) return UI.toast(r.msg, 'error');

  Pages.notifications = function () {

    var html = '<div class="card">' + (ns.length ? '<div class="list">' + ns.map(function (n) {

  <script>/* ==== pages-manage.js ==== */
/* =========================================================
   Area pengelolaan: Trainer Internal, Enterprise Coach, Admin
   (materi, kuis, assessment, penilaian, kelas, laporan)
   ========================================================= */
(function () {
  'use strict';
  var Pages = window.Pages;
  var esc = UI.esc, icon = UI.icon;
  var TL = function () { return Pages.TYPE_LABEL; }, SL = function () { return Pages.SRC_LABEL; };
  function me() { return Auth.user(); }

  /* Program yang boleh dikelola user */
  function scopePrograms(u) {
    u = u || me();
    if (u.role === 'admin' || u.role === 'coach' || u.role === 'executive') return DB.all('programs');
    var mine = DB.where('classes', function (k) { return k.trainerId === u.id; }).map(function (k) { return k.programId; });
    return DB.where('programs', function (p) { return p.trainerId === u.id || (p.coTrainers || []).indexOf(u.id) > -1 || mine.indexOf(p.id) > -1; });
  }
  Pages.scopePrograms = scopePrograms;
  function scopeClasses(u) {
    u = u || me();
    if (u.role !== 'trainer') return DB.all('classes');
    var pids = scopePrograms(u).map(function (p) { return p.id; });
    return DB.where('classes', function (k) { return k.trainerId === u.id || pids.indexOf(k.programId) > -1; });
  }
  function trainerOptions() { return DB.where('users', function (u) { return (u.role === 'trainer' || u.role === 'coach') && u.status === 'active'; }).map(function (u) { return [u.id, u.name + ' (' + ROLES[u.role] + ')']; }); }
  Pages.trainerOptions = trainerOptions;
  function pendingSubs(pids) { return DB.where('submissions', function (s) { var a = DB.find('assessments', s.assessmentId); return s.status === 'submitted' && a && pids.indexOf(a.programId) > -1; }); }

  /* ---------- Dashboard Trainer ---------- */
  Pages.dashTrainer = function () {
    var u = me(), progs = scopePrograms(u), pids = progs.map(function (p) { return p.id; });
    var classes = scopeClasses(u);
    var ens = DB.where('enrollments', function (e) { return pids.indexOf(e.programId) > -1; });
    var pend = pendingSubs(pids);
    var follow = ens.filter(function (e) { return DB.programProgress(e.userId, e.programId) < 50 && (Date.now() - new Date(e.enrolledAt)) > 7 * 864e5; });
    var html = '<div class="welcome"><div><h2>Selamat mengajar, ' + esc(u.name.split(' ')[0]) + '!</h2><p>' + pend.length + ' tugas menunggu penilaian • ' + follow.length + ' peserta perlu tindak lanjut.</p></div><div class="row"><a class="btn btn-primary" href="#/manage/content">' + icon('plus', 16) + ' Kelola Materi</a><a class="btn btn-outline-w" href="#/grading">Nilai Tugas</a></div></div>' +
      '<div class="stats">' + UI.stat('Kelas ditangani', classes.length, 'cal') + UI.stat('Total peserta', ens.length, 'users') + UI.stat('Menunggu penilaian', pend.length, 'task') + UI.stat('Materi dipublikasikan', pids.reduce(function (s, id) { return s + DB.programLessons(id).length; }, 0), 'book') + '</div>' +
      '<div class="grid-21"><div class="card"><div class="card-title"><h3>Kelas Saya</h3></div><div class="table-wrap"><table><thead><tr><th>Kelas</th><th>Peserta</th><th>Rata-rata progres</th><th>Status</th><th></th></tr></thead><tbody>' +
      classes.map(function (k) {
        var p = DB.find('programs', k.programId), ke = DB.where('enrollments', function (e) { return e.classId === k.id; });
        var avg = ke.length ? Math.round(ke.reduce(function (s, e) { return s + DB.programProgress(e.userId, e.programId); }, 0) / ke.length) : 0;
        return '<tr><td><b>' + esc(p ? p.title : '') + '</b><br><small class="muted">' + esc(k.name) + '</small></td><td>' + ke.length + '/' + k.capacity + '</td><td style="min-width:140px">' + UI.progressBar(avg) + '<small>' + avg + '%</small></td><td>' + UI.statusBadge(k.status) + '</td><td><a class="btn btn-soft btn-sm" href="#/manage/content/' + esc(k.programId) + '">Materi</a></td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-title"><h3>Jadwal Mengajar</h3></div>' + Pages.sessionList(Pages.upcomingSessions(classes.map(function (k) { return k.id; }))) + '</div></div>' +
      '<div class="grid2"><div class="card"><div class="card-title"><h3>Submission Terbaru</h3><a class="btn btn-ghost btn-sm" href="#/grading">Semua</a></div>' + subList(pend.slice(0, 5)) + '</div>' +
      '<div class="card"><div class="card-title"><h3>Perlu Tindak Lanjut</h3></div>' + (follow.length ? '<div class="list">' + follow.slice(0, 6).map(function (e) {

    }).join('') + '</div>';

  /* ---------- Dashboard Enterprise Coach (Program Manager) ---------- */
  Pages.dashCoach = function () {
    var u = me(), progs = DB.all('programs'), classes = DB.all('classes');
    var active = progs.filter(function (p) { return p.status === 'published'; });

      '<div class="card"><div class="card-title"><h3>Pemantauan Kelas</h3><a class="btn btn-primary btn-sm" href="#/manage/classes">' + icon('plus', 14) + ' Kelola Kelas</a></div><div class="table-wrap"><table><thead><tr><th>Program / Kelas</th><th>Trainer</th><th>Jadwal</th><th>Kapasitas</th><th>Progres rata-rata</th><th>Status</th></tr></thead><tbody>' +
      classes.map(function (k) {
        var p = DB.find('programs', k.programId), t = DB.find('users', k.trainerId), ke = DB.where('enrollments', function (e) { return e.classId === k.id; });

      '<div class="card"><div class="card-title"><h3>Jadwal Mendatang</h3></div>' + Pages.sessionList(Pages.upcomingSessions()) + '</div></div>';
    App.render(UI.appLayout(html, { title: 'Dashboard Enterprise Coach', subtitle: 'Pengelolaan program, kelas, dan evaluasi' }));
  };

  /* ---------- Kelola Materi, Kuis & Assessment ---------- */
  Pages.manageContent = function (params) {
    var u = me(), progs = scopePrograms(u);
    if (!progs.length) return App.render(UI.appLayout('<div class="card">' + UI.empty('Belum ada program yang ditugaskan kepada Anda.') + '</div>', { title: 'Materi, Kuis & Assessment' }));

      '<label class="row" style="gap:.4rem;font-size:.88rem"><input type="checkbox" id="seq"' + (p.sequential ? ' checked' : '') + '> Wajib berurutan (materi prasyarat)</label><a class="btn btn-ghost btn-sm" href="#/preview/' + esc(p.id) + '">' + icon('eye', 14) + ' Pratinjau</a></div></div>';

      { name: 'pdfSource', label: 'Sumber PDF', type: 'select', value: l && l.type === 'pdf' && !l.fileId && l.url ? 'url' : 'upload', options: [['upload', 'Unggah file PDF'], ['url', 'Link PDF (Google Drive, dsb.)']], show: function (v) { return v.type === 'pdf'; } },

      { name: 'url', label: 'URL', type: 'url', value: l ? l.url : '', placeholder: 'https://…', help: 'Video: link YouTube/Vimeo/MP4. Tautan: Google Docs, artikel, dsb.', show: function (v) { return v.type === 'video' || v.type === 'link' || (v.type === 'pdf' && v.pdfSource === 'url'); }, full: true },
      { name: 'content', label: 'Isi materi / deskripsi', type: 'textarea', rows: 9, value: l ? l.content : '', help: 'Format: "## Judul", "- poin", "**tebal**", "*miring*". Untuk PDF/video/tautan diisi sebagai pengantar.' },
      { name: 'duration', label: 'Estimasi durasi', value: l ? l.duration : '10 menit' },

      { name: 'published', label: 'Publikasikan ke peserta', type: 'checkbox', value: l ? l.published : true }
    ];
    UI.formModal({
      title: l ? 'Ubah Materi' : 'Tambah Materi', size: 'lg', fields: fields,

        if (v.type === 'text' && !v.content) { UI.toast('Isi materi teks wajib diisi.', 'error'); return false; }

        if (v.type === 'pdf' && v.pdfSource === 'upload' && !v.file && !(l && l.fileId)) { UI.toast('Pilih file PDF untuk diunggah.', 'error'); return false; }

  /* ---------- Editor soal ---------- */
  Pages.editQuestions = function (params) {
    var a = DB.find('assessments', params.id);
    if (!a || scopePrograms().map(function (p) { return p.id; }).indexOf(a.programId) === -1) return Pages.notFound();
    var p = DB.find('programs', a.programId);
    var qs = JSON.parse(JSON.stringify(a.questions || []));
    function draw() {
      UI.$('#qlist').innerHTML = qs.length ? qs.map(function (q, i) {
        return '<div class="qedit" data-i="' + i + '"><div class="row between mb"><b>Soal ' + (i + 1) + '</b><div class="row"><label class="row" style="gap:.3rem;font-size:.85rem">Bobot <input type="number" min="1" max="10" value="' + (q.weight || 1) + '" data-w style="width:70px"></label><button class="btn btn-ghost btn-xs" data-delq aria-label="Hapus soal">' + icon('trash', 14) + '</button></div></div>' +
          '<label class="sr" for="qt' + i + '">Pertanyaan</label><textarea id="qt' + i + '" rows="2" data-t placeholder="Tulis pertanyaan…">' + esc(q.text) + '</textarea><p class="help mt" style="margin-bottom:.4rem">Pilih jawaban benar dengan tombol bulat:</p>' +
          q.options.map(function (o, j) {
            return '<div class="opt-row"><input type="radio" name="ans' + i + '" value="' + j + '"' + (q.answer === j ? ' checked' : '') + ' data-a aria-label="Jawaban benar ' + (j + 1) + '"><input value="' + esc(o) + '" data-o="' + j + '" placeholder="Pilihan ' + String.fromCharCode(65 + j) + '"><button class="btn btn-ghost btn-xs" data-delo="' + j + '"' + (q.options.length <= 2 ? ' disabled' : '') + ' aria-label="Hapus pilihan">' + icon('x', 13) + '</button></div>';
          }).join('') + '<button class="btn btn-ghost btn-xs" data-addo>' + icon('plus', 13) + ' Tambah pilihan</button></div>';
      }).join('') : UI.empty('Belum ada soal. Klik "Tambah Soal".');
    }
    var html = '<div class="card flat"><div class="row between"><div><small class="muted">' + esc(p.title) + '</small><h3 style="margin:0">' + esc(a.title) + '</h3><small class="muted">' + TL()[a.type] + ' • nilai minimal ' + a.passingScore + '</small></div><div class="row"><a class="btn btn-ghost" href="#/manage/content/' + esc(p.id) + '">← Kembali</a><button class="btn btn-ghost" id="bulk">' + icon('upload', 14) + ' Impor teks</button><button class="btn btn-soft" id="addq">' + icon('plus', 14) + ' Tambah Soal</button><button class="btn btn-primary" id="saveq">' + icon('check', 14) + ' Simpan Soal</button></div></div></div>' +
      '<div id="qlist"></div>';
    App.render(UI.appLayout(html, { title: 'Editor Soal', subtitle: a.title }));
    draw();
    var list = UI.$('#qlist');
    list.addEventListener('input', function (e) {
      var box = e.target.closest('[data-i]'); if (!box) return; var q = qs[Number(box.dataset.i)];
      if (e.target.matches('[data-t]')) q.text = e.target.value;
      if (e.target.matches('[data-o]')) q.options[Number(e.target.dataset.o)] = e.target.value;
      if (e.target.matches('[data-w]')) q.weight = Math.max(1, Number(e.target.value) || 1);
    });
    list.addEventListener('change', function (e) { var box = e.target.closest('[data-i]'); if (box && e.target.matches('[data-a]')) qs[Number(box.dataset.i)].answer = Number(e.target.value); });
    list.addEventListener('click', function (e) {
      var box = e.target.closest('[data-i]'); if (!box) return; var i = Number(box.dataset.i), q = qs[i];
      if (e.target.closest('[data-delq]')) { qs.splice(i, 1); draw(); }
      else if (e.target.closest('[data-addo]')) { q.options.push(''); draw(); }
      else if (e.target.closest('[data-delo]')) { var j = Number(e.target.closest('[data-delo]').dataset.delo); q.options.splice(j, 1); if (q.answer >= q.options.length) q.answer = 0; else if (q.answer > j) q.answer--; draw(); }
    });
    UI.$('#addq').onclick = function () { qs.push({ id: DB.uid('q'), text: '', options: ['', '', '', ''], answer: 0, weight: 1 }); draw(); var t = UI.$$('[data-t]'); t[t.length - 1].focus(); };

      UI.formModal({
        title: 'Impor soal dari teks', size: 'lg', submitLabel: 'Impor',
        fields: [{ name: 'txt', label: 'Tempel soal', type: 'textarea', rows: 12, required: true, placeholder: 'Apa kepanjangan CTA?\n*A. Call To Action\nB. Content To Ads\nC. Copy Text Area\n\nSoal berikutnya…', help: 'Pisahkan tiap soal dengan baris kosong. Baris pertama = pertanyaan, baris berikutnya = pilihan. Beri tanda * di depan jawaban benar.' }],

      labels.push(BUL[m]);
      reg.push(ens.filter(function (e) { var x = new Date(e.enrolledAt); return x.getMonth() === m && x.getFullYear() === y; }).length);
      comp.push(certs.filter(function (c) { var x = new Date(c.issuedAt); return x.getMonth() === m && x.getFullYear() === y; }).length);
    }
    var rows = progs.map(function (p) {
      var pe = ens.filter(function (e) { return e.programId === p.id; });
      var pc = certs.filter(function (c) { return c.programId === p.id; }).length;
      var post = DB.assessmentsOf(p.id, true).find(function (a) { return a.type === 'posttest'; });
      var pre = DB.assessmentsOf(p.id, true).find(function (a) { return a.type === 'pretest'; });
      var avgOf = function (a) { if (!a) return null; var sc = pe.map(function (e) { return DB.assessmentStatus(e.userId, a).score; }).filter(function (x) { return x != null; }); return sc.length ? Math.round(sc.reduce(function (s, x) { return s + x; }, 0) / sc.length) : null; };
      var rated = pe.filter(function (e) { return e.rating; });
      return { p: p, n: pe.length, done: pc, rate: pe.length ? Math.round(pc / pe.length * 100) : 0, pre: avgOf(pre), post: avgOf(post), sat: rated.length ? (rated.reduce(function (s, e) { return s + e.rating; }, 0) / rated.length).toFixed(1) : '-' };
    });
    var trainers = users.filter(function (u) { return u.role === 'trainer' || u.role === 'coach'; }).map(function (t) {
      var ks = DB.where('classes', function (k) { return k.trainerId === t.id; });
      var te = ens.filter(function (e) { return ks.some(function (k) { return k.id === e.classId; }); });
      var graded = DB.where('submissions', function (s) { return s.gradedBy === t.id; }).length;
      var rated = te.filter(function (e) { return e.rating; });
      return { t: t, classes: ks.length, learners: te.length, graded: graded, sat: rated.length ? (rated.reduce(function (s, e) { return s + e.rating; }, 0) / rated.length).toFixed(1) : '-' };
    }).filter(function (x) { return x.classes; });
    var allPost = rows.filter(function (r) { return r.post != null; });
    var avgPost = allPost.length ? Math.round(allPost.reduce(function (s, r) { return s + r.post; }, 0) / allPost.length) : '-';
    var rated = ens.filter(function (e) { return e.rating; });
    var sat = rated.length ? (rated.reduce(function (s, e) { return s + e.rating; }, 0) / rated.length).toFixed(1) : '-';

    var html = '<div class="stats">' + UI.stat('Peserta terdaftar', learners.length, 'users') + UI.stat('Peserta aktif', activeL.length, 'activity') + UI.stat('Sertifikat terbit', certs.length, 'award') + UI.stat('Rata-rata post-test', avgPost, 'quiz') + UI.stat('Kepuasan peserta', sat + ' / 5', 'star') + '</div>' +
      '<div class="card"><div class="card-title"><h3>Tren Pendaftaran & Penyelesaian (6 bulan)</h3></div>' + UI.lineChart(labels, [{ name: 'Pendaftaran', values: reg }, { name: 'Penyelesaian (sertifikat)', values: comp }], { label: 'Tren pendaftaran dan penyelesaian' }) + '</div>' +
      '<div class="grid2"><div class="card"><div class="card-title"><h3>Pendaftar per Program</h3></div>' + UI.barChart(rows.map(function (r) { return { label: r.p.title, value: r.n }; }).sort(function (a, b) { return b.value - a.value; })) + '</div>' +
      '<div class="card"><div class="card-title"><h3>Tingkat Penyelesaian</h3></div>' + UI.barChart(rows.map(function (r) { return { label: r.p.title, value: r.rate }; }).sort(function (a, b) { return b.value - a.value; }), { suffix: '%', max: 100 }) + '</div></div>' +
      '<div class="card"><div class="card-title"><h3>Kinerja Program</h3><button class="btn btn-ghost btn-sm" id="csvp">' + icon('download', 14) + ' Ekspor CSV</button></div><div class="table-wrap"><table><thead><tr><th>Program</th><th>Status</th><th>Pendaftar</th><th>Selesai</th><th>Penyelesaian</th><th>Rata-rata pretest</th><th>Rata-rata post-test</th><th>Kepuasan</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td><b>' + esc(r.p.title) + '</b></td><td>' + UI.statusBadge(r.p.status) + '</td><td>' + r.n + '</td><td>' + r.done + '</td><td>' + r.rate + '%</td><td>' + (r.pre != null ? r.pre : '-') + '</td><td>' + (r.post != null ? r.post : '-') + '</td><td>' + r.sat + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-title"><h3>Ringkasan Performa Trainer</h3></div><div class="table-wrap"><table><thead><tr><th>Trainer</th><th>Kelas</th><th>Peserta</th><th>Tugas dinilai</th><th>Kepuasan</th></tr></thead><tbody>' +
      (trainers.map(function (x) { return '<tr><td><div class="cell-user">' + UI.avatar(x.t, 30) + '<div><b>' + esc(x.t.name) + '</b><small>' + esc(ROLES[x.t.role]) + '</small></div></div></td><td>' + x.classes + '</td><td>' + x.learners + '</td><td>' + x.graded + '</td><td>' + x.sat + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="muted">Belum ada data.</td></tr>') + '</tbody></table></div></div>';
    App.render(UI.appLayout(html, { title: me().role === 'executive' ? 'Laporan Kinerja' : 'Laporan & Analitik', subtitle: 'Ringkasan peserta, program, evaluasi, dan trainer', actions: '<button class="btn btn-ghost btn-sm" onclick="window.print()">' + icon('download', 14) + ' Cetak laporan</button>' }));
    UI.$('#csvp').onclick = function () { downloadCSV('laporan-program.csv', [['Program', 'Status', 'Pendaftar', 'Selesai', 'Penyelesaian (%)', 'Rata-rata pretest', 'Rata-rata post-test', 'Kepuasan']].concat(rows.map(function (r) { return [r.p.title, r.p.status, r.n, r.done, r.rate, r.pre, r.post, r.sat]; }))); };
  };
})();

</script>

        '<div class="card"><h3>Logo Website</h3><div class="row" style="align-items:flex-start"><div class="logo-preview" id="lp">' + (s.logo ? '<img src="' + s.logo + '" alt="Logo saat ini">' : '<span class="logo-mark" style="width:64px;height:64px;font-size:1.3rem">' + esc(UI.initials(s.siteName)) + '</span>') + '</div>' +
        '<div class="grow"><p class="muted" style="font-size:.86rem">Format PNG, JPG, SVG, atau WEBP. Maks. 5 MB. Gambar akan diperkecil otomatis (maks. lebar 400px). Logo tampil di header, sidebar, footer, sertifikat, dan ikon tab.</p>' +

    } else if (tab === 'pay') {

        '<div class="card"><h3>QRIS</h3><p class="muted" style="font-size:.86rem">Unggah gambar QRIS dari aplikasi merchant Anda (PNG/JPG, jelas & tidak terpotong). Peserta dapat memindai atau mengunduhnya.</p>' +

        '<h3 class="mt2">Publikasikan Perubahan ke Semua Pengunjung</h3><p class="muted" style="font-size:.9rem">Prototype ini menyimpan data di browser. Agar perubahan Anda (pengaturan, program, materi, PDF) tampil di perangkat lain saat website di-hosting, unduh file <code>site-data.js</code> lalu ganti file dengan nama yang sama di folder <code>js/</code> project, kemudian unggah ulang ke hosting.</p>' +
        '<button class="btn btn-primary" id="pub">' + icon('upload', 16) + ' Unduh site-data.js</button>' +
        '<h3 class="mt2">Cadangan Data</h3><div class="row"><button class="btn btn-ghost" id="exp">' + icon('download', 16) + ' Ekspor backup (.json)</button><label class="btn btn-ghost" for="imp">' + icon('upload', 16) + ' Impor backup</label><input type="file" id="imp" accept="application/json" class="sr"></div></div>' +
        '<div class="card"><h3>Penyimpanan</h3><dl class="kv"><dt>Data terstruktur</dt><dd id="lsz">-</dd><dt>File (PDF, dll.)</dt><dd id="fsz">menghitung…</dd></dl><div class="notice warn mt">' + icon('shield', 16) + ' Untuk versi produksi, gunakan backend (REST API + PostgreSQL/MySQL) sesuai PRD agar data tersimpan terpusat dan aman.</div>' +

    }

      '<div class="tabs">' + tabs.map(function (t) { return '<a class="tab ' + (tab === t[0] ? 'on' : '') + '" href="#/admin/settings?tab=' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>' + body;

    var sf = UI.$('#sf');

      e.preventDefault();
      var fields = F[tab], ok = true;
      UI.$$('input,textarea', sf).forEach(function (el) { var b = el.closest('.field'); if (!b) return; var bad = !el.checkValidity(); b.classList.toggle('invalid', bad); var x = b.querySelector('.err'); if (x) x.textContent = bad ? el.validationMessage : ''; if (bad) ok = false; });

    if (tab === 'system') {
      if (!DB.online) try { UI.$('#lsz').textContent = (new Blob([localStorage.getItem('insanasia_lms_v3') || '']).size / 1024).toFixed(0) + ' KB (batas ±5 MB)'; } catch (e) { }
      if (!DB.online) DB.Files.all().then(function (all) { var n = Object.keys(all).length, sz = Object.keys(all).reduce(function (s, k) { return s + (all[k].size || 0); }, 0); UI.$('#fsz').textContent = n + ' file • ' + (sz / 1048576).toFixed(2) + ' MB'; }).catch(function () { UI.$('#fsz').textContent = '-'; });
      UI.$('#allowreg').onchange = function (e) { DB.setSettings({ allowRegistration: e.target.checked }); DB.log((e.target.checked ? 'Membuka' : 'Menutup') + ' pendaftaran peserta', 'settings'); UI.toast(e.target.checked ? 'Pendaftaran dibuka.' : 'Pendaftaran ditutup.'); };
      UI.$('#exp').onclick = function () { exportData(false); };
      if (DB.online) return;
      UI.$('#pub').onclick = function () { exportData(true); };
      UI.$('#imp').onchange = function (e) {
        var f = e.target.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var obj = JSON.parse(fr.result);
            if (!obj.settings || !obj.users || !obj.programs) throw new Error('Format backup tidak dikenali.');
            UI.confirm('Impor akan mengganti seluruh data saat ini. Lanjutkan?', function () {
              var files = obj.files || {}; delete obj.files;
              DB.replaceAll(obj);
              Promise.all(Object.keys(files).map(function (id) { return fetch(files[id]).then(function (r) { return r.blob(); }).then(function (b) { return DB.Files.put(b, id); }); })).then(function () {
                UI.toast('Backup berhasil diimpor.'); App.refresh();
              });
            }, 'Impor');
          } catch (err) { UI.toast(err.message || 'File tidak valid.', 'error'); }
        };
        fr.readAsText(f);
      };
      UI.$('#reset').onclick = function () {
        UI.confirm('Reset seluruh data ke kondisi demo? Tindakan ini tidak dapat dibatalkan.', function () {
          DB.reset().then(function () { sessionStorage.clear(); localStorage.removeItem('insanasia_lms_session'); UI.toast('Data direset. Silakan masuk kembali.', 'info'); location.hash = '#/login'; });
        }, 'Reset Data');
      };
    }
  };

  function blobToDataURL(b) { return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.readAsDataURL(b); }); }
  function exportData(asSite) {
    UI.toast('Menyiapkan file…', 'info');
    DB.Files.all().then(function (all) {
      var ids = Object.keys(all);
      return Promise.all(ids.map(function (id) { return blobToDataURL(all[id]); })).then(function (urls) { var o = {}; ids.forEach(function (id, i) { o[id] = urls[i]; }); return o; });
    }).catch(function () { return {}; }).then(function (files) {
      var obj = JSON.parse(JSON.stringify(DB.data));
      obj.files = files;
      var name, content, type;
      if (asSite) {
        obj.meta.siteVersion = 'v' + Date.now();
        obj.notifications = []; obj.resets = [];
        DB.data.meta.siteVersion = obj.meta.siteVersion; DB.save();
        content = '/* Dibuat otomatis dari menu Pengaturan Website › Sistem & Data (' + new Date().toLocaleString('id-ID') + ').\n   Ganti file js/site-data.js di project dengan file ini agar perubahan tampil untuk semua pengunjung. */\nwindow.SITE_DATA = ' + JSON.stringify(obj) + ';\n';
        name = 'site-data.js'; type = 'application/javascript';
        DB.log('Mempublikasikan data situs (site-data.js)', 'settings');
      } else {
        content = JSON.stringify(obj, null, 1); name = 'backup-insanasia-lms-' + new Date().toISOString().slice(0, 10) + '.json'; type = 'application/json';
        DB.log('Mengekspor backup data', 'settings');
      }
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      UI.toast('File ' + name + ' diunduh.');
    });
  }
})();

  <script>/* ==== pages-payment.js ==== */
/* =========================================================
   Pembayaran program berbayar (QRIS / e-wallet / transfer)
   - Peserta: unggah bukti → kelas terkunci sampai disetujui
   - Admin & Enterprise Coach: verifikasi (setujui / tolak)
   ========================================================= */
(function () {
  'use strict';
  var Pages = window.Pages;
  var esc = UI.esc, icon = UI.icon;
  function me() { return Auth.user(); }

  var WALLETS = [['payDana', 'DANA'], ['payOvo', 'OVO'], ['payGopay', 'GoPay'], ['payShopeepay', 'ShopeePay'], ['payLinkaja', 'LinkAja']];
  function methods(s, p) {
    var m = [];
    if ((p && p.payQris) || s.payQris) m.push(['QRIS', 'QRIS']);
    WALLETS.forEach(function (w) { if (s[w[0]]) m.push([w[1], w[1]]); });
    if (s.payBankAccount) m.push(['Transfer Bank', 'Transfer Bank' + (s.payBankName ? ' ' + s.payBankName : '')]);
    if (!m.length) m.push(['Lainnya', 'Lainnya']);
    return m;
  }

  /* Info tujuan pembayaran (QRIS + nomor) */
  function payInfo(p) {
    var s = DB.settings();
    var rows = WALLETS.filter(function (w) { return s[w[0]]; }).map(function (w) {
      return '<div class="pay-row"><span class="pay-name">' + w[1] + '</span><b class="pay-num">' + esc(s[w[0]]) + '</b><button type="button" class="btn btn-ghost btn-xs" data-copy="' + esc(s[w[0]]) + '">' + icon('file', 12) + ' Salin</button></div>';
    }).join('');
    if (s.payBankAccount) rows += '<div class="pay-row"><span class="pay-name">' + esc(s.payBankName || 'Bank') + '</span><b class="pay-num">' + esc(s.payBankAccount) + '</b><button type="button" class="btn btn-ghost btn-xs" data-copy="' + esc(s.payBankAccount) + '">' + icon('file', 12) + ' Salin</button>' + (s.payBankHolder ? '<small class="muted" style="flex-basis:100%">a.n. ' + esc(s.payBankHolder) + '</small>' : '') + '</div>';
    var qris = p.payQris || s.payQris;
    var none = !qris && !rows;
    return '<div class="pay-amount"><small>Total yang harus dibayar</small><b>' + esc(UI.priceLabel(p)) + '</b><span>' + esc(p.title) + '</span></div>' +
      (none ? '<div class="notice warn">Admin belum mengatur metode pembayaran. Hubungi ' + esc(s.email) + '.</div>' :
        '<div class="pay-grid">' +
        (qris ? '<div class="qris-box"><img src="' + qris + '" alt="QRIS ' + esc(s.payHolder || '') + '"><a class="btn btn-ghost btn-xs mt" href="' + qris + '" download="QRIS-' + esc((s.siteName || 'pembayaran').replace(/\s+/g, '-')) + '.png">' + icon('download', 12) + ' Unduh QRIS</a></div>' : '') +
        '<div class="pay-list">' + (s.payHolder ? '<p class="muted" style="margin:0 0 .4rem;font-size:.85rem">Atas nama: <b style="color:var(--ink)">' + esc(s.payHolder) + '</b></p>' : '') + rows + '</div></div>') +
      (s.payInstructions ? '<p class="muted mt" style="font-size:.86rem">' + esc(s.payInstructions) + '</p>' : '');
  }
  function bindCopy(root) {
    UI.$$('[data-copy]', root).forEach(function (b) {
      b.onclick = function () {
        var t = b.dataset.copy;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { UI.toast('Nomor disalin: ' + t); })
          .catch(function () { UI.toast('Salin manual: ' + t, 'info'); });
      };
    });
  }
  Pages.payInfo = payInfo;

  /* Modal bayar + unggah bukti (pendaftaran baru atau kirim ulang) */
  Pages.payModal = function (p, k, en) {
    var u = me(), s = DB.settings();
    var fields = [
      { name: 'info', type: 'html', html: '<div class="card flat" style="padding:.8rem 1rem"><b>' + esc(p.title) + '</b><p class="muted" style="margin:0;font-size:.86rem">' + esc(k ? k.name + ' • ' + UI.fmtDate(k.startAt) + ' – ' + UI.fmtDate(k.endAt) : '') + '</p></div>' + payInfo(p) },
      { name: 'method', label: 'Metode yang Anda gunakan', type: 'select', options: methods(s, p), required: true },
      { name: 'senderName', label: 'Nama pengirim / pemilik akun', value: u.name, required: true },
      { name: 'proof', label: 'Bukti pembayaran (foto/screenshot atau PDF, maks. 5 MB)', type: 'file', accept: 'image/png,image/jpeg,image/webp,application/pdf', required: true, full: true },
      { name: 'note', label: 'Catatan (opsional)', type: 'textarea', rows: 2, placeholder: 'contoh: transfer pukul 10.15 WIB' }
    ];
    UI.formModal({
      title: en ? 'Kirim Ulang Bukti Pembayaran' : 'Pembayaran Program', size: 'lg', fields: fields, submitLabel: 'Kirim Bukti Pembayaran',
      onOpen: function (w) { bindCopy(w); },
      onSubmit: function (v) {
        if (!v.proof) { UI.toast('Unggah bukti pembayaran terlebih dahulu.', 'error'); return false; }
        if (!/^(image\/(png|jpeg|webp)|application\/pdf)$/.test(v.proof.type)) { UI.toast('Bukti harus berupa gambar (PNG/JPG/WEBP) atau PDF.', 'error'); return false; }
        return UI.storeFile(v.proof, { maxMB: 5 }).then(function (f) {
          var kid = k ? k.id : (en ? en.classId : null);
          var auto = p.payVerify === 'auto';
          var newStatus = auto ? 'active' : 'pending_payment';
          var enId = en ? en.id : DB.uid('en');
          // bukti bayar dicatat lebih dulu, lalu pendaftaran (urutan ini diperiksa server)
          DB.insert('payments', {
            userId: u.id, programId: p.id, classId: kid, enrollmentId: enId, amount: Number(p.priceAmount || String(p.price || '').replace(/[^\d]/g, '')) || 0,
            method: v.method, senderName: v.senderName, note: v.note, proofFileId: f.id, proofName: f.name, status: 'pending', createdAt: new Date().toISOString(), mode: p.payVerify === 'auto' ? 'auto' : 'manual'
          });
          if (!en) {
            DB.bumpClass(kid);
            en = DB.insert('enrollments', { id: enId, userId: u.id, classId: kid, programId: p.id, status: newStatus, enrolledAt: new Date().toISOString(), rating: null, review: '' });
          } else { en.status = newStatus; DB.save(); }
          if (p.notice) DB.notify(u.id, 'Perhatian – ' + p.title + ': ' + String(p.notice).replace(/[*#]/g, '').slice(0, 160), '#/learn/' + p.id);
          DB.notifyRole(['admin', 'coach'], (auto ? 'Perlu dicek – peserta sudah masuk kelas: ' : 'Bukti bayar baru: ') + u.name + ' – ' + p.title + ' (' + UI.priceLabel(p) + ')', '#/payments');
          DB.notify(u.id, auto ? 'Terima kasih! Kelas ' + p.title + ' sudah terbuka. Jangan lupa gabung grup WhatsApp kelas.' : 'Bukti pembayaran ' + p.title + ' terkirim. Kelas terbuka setelah diverifikasi admin.', '#/learn/' + p.id);
          DB.log(u.name + ' mengirim bukti pembayaran ' + p.title, 'payment');
          UI.toast(auto ? 'Bukti terkirim — kelas Anda sudah terbuka!' : 'Bukti pembayaran terkirim. Menunggu verifikasi admin.');
          if (location.hash === '#/learn/' + p.id) App.refresh(); else location.hash = '#/learn/' + p.id;
        });
      }
    });
  };

  /* Halaman status pembayaran (pengganti ruang kelas selama belum lunas) */
  Pages.paymentStatus = function (p) {
    var u = me(), en = DB.enrollment(u.id, p.id);
    var pays = DB.where('payments', function (x) { return x.userId === u.id && x.programId === p.id; }).slice().reverse();
    var last = pays[0];
    var rejected = en.status === 'payment_rejected';
    var head = rejected
      ? '<div class="pay-status rejected"><div class="ps-ic">' + icon('x', 26) + '</div><div><h2>Pembayaran ditolak</h2><p>' + esc(last && last.reason ? 'Alasan: ' + last.reason : 'Bukti pembayaran belum dapat diverifikasi.') + ' Silakan kirim ulang bukti yang benar.</p></div></div>'
      : '<div class="pay-status pending"><div class="ps-ic">' + icon('clock', 26) + '</div><div><h2>Menunggu verifikasi pembayaran</h2><p>Bukti pembayaran Anda sudah kami terima. Kelas <b>' + esc(p.title) + '</b> akan terbuka otomatis setelah admin menyetujuinya.</p></div></div>';
    var hist = pays.length ? '<div class="list">' + pays.map(function (x) {
      return '<div class="list-item"><div class="li-ic">' + icon('wallet') + '</div><div class="li-b"><b>' + esc(UI.rupiah(x.amount) || '-') + ' • ' + esc(x.method) + '</b><small>Dikirim ' + UI.fmtDate(x.createdAt, true) + (x.reason ? ' • Alasan ditolak: ' + esc(x.reason) : '') + '</small></div>' + payBadge(x.status) + '</div>';
    }).join('') + '</div>' : '<p class="muted">Belum ada bukti pembayaran.</p>';
    var html = head + Pages.programNotice(p, en) +
      '<div class="grid-21"><div class="card"><div class="card-title"><h3>Informasi Pembayaran</h3></div>' + payInfo(p) +
      (rejected || !last ? '<button class="btn btn-primary btn-lg mt" id="resend">' + icon('upload', 16) + ' ' + (last ? 'Kirim Ulang Bukti Pembayaran' : 'Kirim Bukti Pembayaran') + '</button>' : '') + '</div>' +
      '<div class="card"><div class="card-title"><h3>Riwayat Pembayaran</h3></div>' + hist +
      '<p class="muted mt" style="font-size:.85rem">Butuh bantuan? Hubungi ' + esc(DB.settings().email) + (DB.settings().whatsapp ? ' atau <a target="_blank" rel="noopener" href="https://wa.me/' + esc(String(DB.settings().whatsapp).replace(/\D/g, '')) + '">WhatsApp admin</a>' : '') + '.</p></div></div>';
    App.render(UI.appLayout(html, { title: 'Status Pembayaran', subtitle: p.title }));
    bindCopy(document);
    var r = UI.$('#resend'); if (r) r.onclick = function () { Pages.payModal(p, DB.find('classes', en.classId), en); };
  };
  function payBadge(st) { return st === 'approved' ? UI.badge('Disetujui', 'green') : st === 'rejected' ? UI.badge('Ditolak', 'red') : UI.badge('Menunggu verifikasi', 'amber'); }
  Pages.payBadge = payBadge;

  /* Penjaga akses: dipanggil sebelum ruang kelas / kuis */
  Pages.guardPaid = function (p) {
    var u = me(), acc = DB.accessOf(u.id, p.id);
    if (acc === 'pending' || acc === 'rejected') { Pages.paymentStatus(p); return false; }
    // Baru saja disetujui tetapi materi masih versi terkunci → muat ulang dari server
    if (acc === 'active' && DB.online && (DB.programLessons(p.id).some(function (l) { return l.locked; }) || DB.assessmentsOf(p.id).some(function (a) { return a.locked; }))) {
      App.render(UI.appLayout('<div class="card center"><div class="empty">' + icon('clock', 30) + '<p>Membuka materi kelas…</p></div></div>', { title: 'Ruang Kelas', subtitle: p.title }));
      DB.reload().then(function () { App.refresh(); }).catch(function (e) { UI.toast(e.message, 'error'); });
      return false;
    }
    return true;
  };

  /* ---------- Verifikasi pembayaran (Admin & Enterprise Coach) ---------- */
  Pages.payments = function (params, q) {
    var tab = q.status || 'pending';
    var all = DB.all('payments').slice().reverse();
    var list = all.filter(function (x) { return tab === 'all' || x.status === tab; });
    var pend = all.filter(function (x) { return x.status === 'pending'; }).length;
    var income = all.filter(function (x) { return x.status === 'approved'; }).reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
    var tabs = [['pending', 'Menunggu (' + pend + ')'], ['approved', 'Disetujui'], ['rejected', 'Ditolak'], ['all', 'Semua']];
    var html = '<div class="stats">' + UI.stat('Menunggu verifikasi', pend, 'clock') + UI.stat('Pembayaran disetujui', all.filter(function (x) { return x.status === 'approved'; }).length, 'check') + UI.stat('Total pemasukan', UI.rupiah(income) || 'Rp0', 'wallet') + '</div>' +
      '<div class="tabs">' + tabs.map(function (t) { return '<a class="tab ' + (tab === t[0] ? 'on' : '') + '" href="#/payments?status=' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>' +
      '<div class="card">' + (list.length ? '<div class="table-wrap"><table><thead><tr><th>Peserta</th><th>Program / Kelas</th><th>Nominal</th><th>Metode</th><th>Dikirim</th><th>Bukti</th><th>Status</th><th></th></tr></thead><tbody>' + list.map(function (x) {
        var l = DB.find('users', x.userId), p = DB.find('programs', x.programId), k = DB.find('classes', x.classId);
        return '<tr><td><div class="cell-user">' + UI.avatar(l, 32) + '<div><b>' + esc(l ? l.name : '-') + '</b><small>' + esc(l ? l.email : '') + '</small></div></div></td>' +
          '<td><b>' + esc(p ? p.title : '-') + '</b><br><small class="muted">' + esc(k ? k.name : '') + '</small></td><td><b>' + esc(UI.rupiah(x.amount) || '-') + '</b></td>' +
          '<td>' + esc(x.method) + '<br><small class="muted">a.n. ' + esc(x.senderName || '-') + '</small>' + (x.note ? '<br><small class="muted">' + esc(x.note) + '</small>' : '') + '</td>' +
          '<td><small>' + UI.fmtDate(x.createdAt, true) + '</small></td>' +
          '<td>' + (x.proofFileId ? '<button class="btn btn-soft btn-xs" data-proof="' + esc(x.id) + '">' + icon('eye', 13) + ' Lihat</button>' : '-') + '</td>' +
          '<td>' + payBadge(x.status) + (x.mode === 'auto' && x.status === 'pending' ? '<br><small class="muted">Peserta sudah masuk kelas</small>' : '') + (x.reason ? '<br><small class="muted">' + esc(x.reason) + '</small>' : '') + '</td>' +
          '<td>' + (x.status === 'pending' ? '<div class="row"><button class="btn btn-primary btn-xs" data-ok="' + esc(x.id) + '">' + icon('check', 13) + ' Setujui</button><button class="btn btn-ghost btn-xs" data-no="' + esc(x.id) + '">Tolak</button></div>' : '<small class="muted">' + UI.fmtDate(x.reviewedAt) + '</small>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : UI.empty(tab === 'pending' ? 'Tidak ada pembayaran yang menunggu verifikasi.' : 'Belum ada data.')) + '</div>';
    App.render(UI.appLayout(html, { title: 'Verifikasi Pembayaran', subtitle: 'Periksa bukti transfer peserta program berbayar', actions: me().role === 'admin' ? '<a class="btn btn-ghost btn-sm" href="#/admin/settings?tab=pay">' + icon('cog', 14) + ' Atur QRIS & E-Wallet</a>' : '' }));

    UI.$$('[data-proof]').forEach(function (b) { b.onclick = function () { var x = DB.find('payments', b.dataset.proof); proofModal(x); }; });
    UI.$$('[data-ok]').forEach(function (b) { b.onclick = function () { approve(DB.find('payments', b.dataset.ok)); }; });
    UI.$$('[data-no]').forEach(function (b) { b.onclick = function () { reject(DB.find('payments', b.dataset.no)); }; });
  };
  function proofModal(x) {
    var isPdf = /\.pdf$/i.test(x.proofName || '') ;
    UI.modal({
      title: 'Bukti Pembayaran', size: 'lg',
      body: '<div id="pv" class="proof-view"><p class="muted">Memuat…</p></div>',
      footer: '<button class="btn btn-ghost" data-close>Tutup</button><button class="btn btn-ghost" id="pv-open">' + icon('eye', 14) + ' Buka di tab baru</button>' + (x.status === 'pending' ? '<button class="btn btn-primary" id="pv-ok">' + icon('check', 14) + ' Setujui</button>' : ''),
      onOpen: function (w) {
        DB.Files.get(x.proofFileId).then(function (blob) {
          var box = w.querySelector('#pv'); if (!box) return;
          if (!blob) { box.innerHTML = '<p class="muted">File tidak ditemukan.</p>'; return; }
          var url = URL.createObjectURL(blob);
          var asPdf = isPdf || (blob.type === 'application/pdf' && !/\.(png|jpe?g|webp)$/i.test(x.proofName || ''));
          box.innerHTML = asPdf ? '<iframe class="pdf-frame" src="' + url + '" title="Bukti PDF"></iframe>' : '<img src="' + url + '" alt="Bukti pembayaran">';
        });
        w.querySelector('#pv-open').onclick = function () { UI.openStoredFile(x.proofFileId, x.proofName); };
        var ok = w.querySelector('#pv-ok'); if (ok) ok.onclick = function () { UI.closeModal(); approve(x); };
      }
    });
  }
  function approve(x) {
    var l = DB.find('users', x.userId), p = DB.find('programs', x.programId);
    UI.confirm('Setujui pembayaran ' + (UI.rupiah(x.amount) || '') + ' dari ' + (l ? l.name : 'peserta') + '?' + (x.mode === 'auto' ? '' : ' Peserta langsung bisa masuk kelas.'), function () {
      x.status = 'approved'; x.reviewedBy = me().id; x.reviewedAt = new Date().toISOString(); x.reason = '';
      var en = DB.find('enrollments', x.enrollmentId) || DB.enrollment(x.userId, x.programId);
      if (en) en.status = 'active';
      DB.save();
      DB.notify(x.userId, 'Pembayaran ' + (p ? p.title : '') + ' telah diverifikasi. ' + (x.mode === 'auto' ? 'Terima kasih!' : 'Kelas Anda sudah terbuka — selamat belajar!') + (p && (p.accessInfo || p.waGroup || p.gformLink) ? ' Lihat info gabung grup di halaman pelatihan.' : ''), '#/learn/' + x.programId);
      var k = DB.find('classes', x.classId); if (k && k.trainerId) DB.notify(k.trainerId, (l ? l.name : 'Peserta') + ' resmi bergabung di ' + (p ? p.title : '') + '.', '#/manage/learners');
      DB.log('Menyetujui pembayaran ' + (l ? l.name : '') + ' – ' + (p ? p.title : ''), 'payment');
      UI.toast('Pembayaran disetujui. Kelas peserta terbuka.'); App.refresh();
    }, 'Setujui');
  }
  function reject(x) {
    var l = DB.find('users', x.userId), p = DB.find('programs', x.programId);
    UI.formModal({
      title: 'Tolak Pembayaran', submitLabel: 'Tolak Pembayaran',
      fields: [{ name: 'warn', type: 'html', html: '<div class="notice warn">Akses kelas peserta akan dikunci sampai ia mengirim bukti yang benar.</div>' }, { name: 'reason', label: 'Alasan penolakan (dikirim ke peserta)', type: 'textarea', rows: 3, required: true, placeholder: 'contoh: Nominal tidak sesuai / bukti tidak terbaca' }],
      onSubmit: function (v) {
        x.status = 'rejected'; x.reason = v.reason; x.reviewedBy = me().id; x.reviewedAt = new Date().toISOString();
        var en = DB.find('enrollments', x.enrollmentId) || DB.enrollment(x.userId, x.programId);
        if (en) en.status = 'payment_rejected';
        DB.save();
        DB.notify(x.userId, 'Pembayaran ' + (p ? p.title : '') + ' ditolak: ' + v.reason + '. Silakan kirim ulang bukti.', '#/learn/' + x.programId);
        DB.log('Menolak pembayaran ' + (l ? l.name : '') + ' – ' + (p ? p.title : ''), 'payment');
        UI.toast('Pembayaran ditolak & peserta diberi tahu.', 'info'); App.refresh();
      }
    });
  }
})();

</script>
  <script>/* ==== certificate.js ==== */
/* =========================================================
   Sertifikat: desain profesional + editor khusus Admin
   Semua ukuran memakai satuan "em" dari lebar sertifikat
   (container query), jadi tampilan sama persis di layar,
   HP, maupun saat dicetak / disimpan sebagai PDF.
   ========================================================= */
(function () {
  'use strict';
  var Pages = window.Pages;
  var esc = UI.esc, icon = UI.icon;
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  function longDate(iso) { var d = new Date(iso || Date.now()); return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }

  var TITLE_FONTS = [['Cinzel', 'Cinzel – klasik monumental'], ['Playfair Display', 'Playfair Display – elegan editorial'], ['Cormorant Garamond', 'Cormorant Garamond – serif halus'], ['Plus Jakarta Sans', 'Plus Jakarta Sans – modern']];
  var NAME_FONTS = [['Great Vibes', 'Great Vibes – sambung elegan'], ['Pinyon Script', 'Pinyon Script – kaligrafi formal'], ['Playfair Display', 'Playfair Display – serif tegas'], ['Cormorant Garamond', 'Cormorant Garamond – serif klasik']];
  var TEMPLATES = [['classic', 'Klasik Elegan'], ['royal', 'Royal Gelap'], ['gold', 'Emas Premium'], ['corporate', 'Korporat'], ['modern', 'Modern'], ['minimal', 'Minimalis']];
  var TPL_DESC = { classic: 'Bingkai ganda & ornamen emas', royal: 'Latar gelap mewah, aksen emas', gold: 'Bingkai art-deco keemasan', corporate: 'Bersih dengan aksen geometris', modern: 'Pita samping berwarna', minimal: 'Sederhana & bersih' };
  Pages.CERT_TEMPLATES = TEMPLATES;

  function design(s) {
    s = s || DB.settings();
    var d = Object.assign({
      template: 'classic', primary: '#3B1670', accent: '#B8913F',
      titleFont: 'Cinzel', nameFont: 'Great Vibes',
      titleText: 'Sertifikat', subtitleText: 'Certificate of Completion',
      introText: 'Dengan bangga diberikan kepada', bodyText: 'atas keberhasilannya menyelesaikan program pelatihan',
      showSeal: true, showWatermark: true, bgImage: null, stamp: null,
      signers: null
    }, s.certDesign || {});
    if (!d.signers || !d.signers.length) d.signers = [{ name: s.certSignerName || '', title: s.certSigner || '', sign: null }];
    return d;
  }
  Pages.certDesign = design;

  /* Segel emas (rosette) */
  function seal(d, s) {
    var pts = [], n = 36, R = 50, r = 45;
    for (var i = 0; i < n * 2; i++) { var a = Math.PI * i / n, rr = i % 2 ? r : R; pts.push((60 + rr * Math.cos(a)).toFixed(2) + ',' + (60 + rr * Math.sin(a)).toFixed(2)); }
    var id = 'sg' + Math.random().toString(36).slice(2, 7);
    var label = (s.siteName || 'INSANASIA').toUpperCase();
    return '<svg class="cx-seal" viewBox="0 0 120 150" aria-hidden="true"><defs>' +
      '<linearGradient id="' + id + 'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset=".45" stop-color="' + d.accent + '"/><stop offset="1" stop-color="#7A5A1E"/></linearGradient>' +
      '<path id="' + id + 'p" d="M60,60 m-31,0 a31,31 0 1,1 62,0 a31,31 0 1,1 -62,0"/></defs>' +
      '<path d="M40 95 L30 145 L45 135 L52 148 L58 100 Z" fill="' + d.primary + '"/><path d="M80 95 L90 145 L75 135 L68 148 L62 100 Z" fill="' + d.primary + '" opacity=".85"/>' +
      '<polygon points="' + pts.join(' ') + '" fill="url(#' + id + 'g)"/>' +
      '<circle cx="60" cy="60" r="40" fill="none" stroke="#FFF6D8" stroke-opacity=".8" stroke-width="1.2"/>' +
      '<circle cx="60" cy="60" r="24" fill="none" stroke="#FFF6D8" stroke-opacity=".7" stroke-width=".8"/>' +
      '<text font-family="Cinzel, serif" font-size="7.2" letter-spacing="1.6" fill="#FFF8E1"><textPath href="#' + id + 'p" startOffset="0">' + esc(label.slice(0, 18)) + ' • TERSERTIFIKASI •</textPath></text>' +
      '<text x="60" y="58" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="13" fill="#FFF8E1">' + esc(UI.initials(s.siteName).slice(0, 2)) + '</text>' +
      '<text x="60" y="70" text-anchor="middle" font-family="Cinzel, serif" font-size="6.5" fill="#FFF8E1">' + new Date().getFullYear() + '</text></svg>';
  }
  function corner(cls, d) {
    return '<svg class="cx-corner ' + cls + '" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="' + d.accent + '" stroke-width="1.4">' +
      '<path d="M4 60 V4 H60"/><path d="M12 44 V12 H44" stroke-width=".9"/>' +
      '<path d="M4 4 Q30 10 34 34 Q10 30 4 4Z" fill="' + d.accent + '" fill-opacity=".18"/>' +
      '<circle cx="22" cy="22" r="3.2" fill="' + d.accent + '"/><path d="M60 4 q6 4 12 0 M4 60 q4 6 0 12" stroke-width="1"/></g></svg>';
  }
  function decoCorner(cls, d) {
    return '<svg class="cx-corner deco ' + cls + '" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="' + d.accent + '">' +
      '<path d="M2 2 H40 V8 H8 V40 H2 Z" fill="' + d.accent + '" stroke="none"/>' +
      '<path d="M14 14 H56 M14 14 V56" stroke-width="1.6"/><path d="M20 20 H46 M20 20 V46" stroke-width=".8"/>' +
      '<rect x="24" y="24" width="8" height="8" transform="rotate(45 28 28)" fill="' + d.accent + '" stroke="none"/></g></svg>';
  }
  function signer(sg) {
    if (!sg || (!sg.name && !sg.title && !sg.sign)) return '<div></div>';
    return '<div class="cx-sign">' + (sg.sign ? '<img src="' + sg.sign + '" alt="Tanda tangan ' + esc(sg.name || '') + '">' : '<span class="cx-sign-space"></span>') +
      '<b>' + esc(sg.name || '') + '</b><small>' + esc(sg.title || '') + '</small></div>';
  }

  /* HTML sertifikat. data = {name, program, number, code, issuedAt, verifyUrl} */
  Pages.certHTML = function (data, d, s) {
    s = s || DB.settings(); d = d || design(s);

    form.addEventListener('change', function (e) {

      UI.readImage(t.files[0], map[0], map[1]).then(function (img) {
        if (t.name === 's0sign') d.signers[0].sign = img; else if (t.name === 's1sign') d.signers[1].sign = img; else d[t.name] = img;
        t.value = ''; draw();
      }).catch(function (err) { UI.toast(err.message, 'error'); });

    draw();
    UI.$('#cxsave').onclick = function () {
      var v = UI.readForm(form, F);

    };

/* =========================================================

(function () {
  'use strict';
  var P = window.Pages;
  var ALL = ['learner', 'trainer', 'coach', 'admin', 'executive'];
  var STAFF = ['trainer', 'coach', 'admin'];

  /* [pola, handler, roles (null = publik)] */
  var routes = [
    ['/', function () { P.home(); }, null],
    ['/programs', P.programs, null],
    ['/program/:id', P.program, null],
    ['/trainers', P.trainers, null],

    ['/certificates', function (p, q) { P.myCertificates(p, q); }, ['learner']],

    ['/manage/content', function (p, q) { P.manageContent(p, q); }, STAFF],

    ['/schedule', function (p, q) { P.schedule(p, q); }, ['trainer', 'coach']],
    ['/manage/classes', function (p, q) { P.manageClasses(p, q); }, ['coach', 'admin']],

    ['/admin/users', function (p, q) { P.adminUsers(p, q); }, ['admin']],

    ['/admin/cms', function (p, q) { P.adminCMS(p, q); }, ['admin']],
    ['/admin/logs', function (p, q) { P.adminLogs(p, q); }, ['admin']],
    ['/admin/settings', function (p, q) { P.adminSettings(p, q); }, ['admin']]
  ];

  function parse() {
    var h = location.hash.replace(/^#/, '') || '/';
    var parts = h.split('?'), path = parts[0] || '/', q = {};
    (parts[1] || '').split('&').forEach(function (kv) { if (!kv) return; var x = kv.split('='); q[decodeURIComponent(x[0])] = decodeURIComponent((x[1] || '').replace(/\+/g, ' ')); });
    return { path: path.replace(/\/+$/, '') || '/', q: q };
  }
  function match(pattern, path) {
    var a = pattern.split('/'), b = path.split('/');
    if (a.length !== b.length) return null;
    var params = {};
    for (var i = 0; i < a.length; i++) {
      if (a[i][0] === ':') params[a[i].slice(1)] = decodeURIComponent(b[i]);
      else if (a[i] !== b[i]) return null;
    }
    return params;
  }

  var busy = false, routedKey = null;
  function hashKey() { return location.hash.split('?')[0] + '|' + (location.hash.split('?')[1] || ''); }
  function reduceMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  /* Pindah halaman: crossfade halus (View Transitions) tanpa memutar ulang animasi */
  function smooth(fn) {
    var key = hashKey(), isNew = key !== routedKey; routedKey = key;
    if (isNew && App.booted && document.startViewTransition && !reduceMotion()) {
      App.inTransition = true;

    } else fn();

    if (DB.online && DB.needsInit) return P.setup();
    if (busy) return;
    var stale = DB.refreshIfStale();
    stale.then(function (changed) { if (changed) { busy = true; try { doRoute(); } finally { busy = false; } } })
      .catch(function (e) { UI.toast(e.message, 'error'); });
    smooth(doRoute);
  }
  function doRoute() {
    UI.closeModal();
    var r = parse();
    for (var i = 0; i < routes.length; i++) {
      var params = match(routes[i][0], r.path);
      if (!params) continue;
      var roles = routes[i][2];
      if (roles) {
        var u = Auth.user();
        if (!u) { location.hash = '#/login?next=' + encodeURIComponent(location.hash); return; }
        if (roles.indexOf(u.role) === -1) { forbidden(); return; }
      }
      try { routes[i][1](params, r.q); }
      catch (err) { console.error(err); App.render(UI.publicLayout('<section class="section"><div class="container"><h2>Terjadi kesalahan</h2><p class="muted">' + UI.esc(err.message) + '</p><a class="btn btn-primary" href="#/">Beranda</a></div></section>')); }
      return;
    }
    P.notFound();
  }
  function forbidden() {
    App.render(UI.appLayout('<div class="card center"><div class="empty">' + UI.icon('lock', 36) + '<h2>Akses ditolak</h2><p>Halaman ini hanya dapat diakses oleh role tertentu. Anda masuk sebagai <b>' + UI.esc(ROLES[Auth.user().role]) + '</b>.</p><a class="btn btn-primary" href="#/dashboard">Kembali ke Dashboard</a></div></div>', { title: 'Akses Ditolak' }));
  }

  var lastKey = null;
  /* Navbar gelap saat berada di atas hero, terang setelah di-scroll */
  var navTick = false;
  function updateNav() {
    navTick = false;
    var h = document.querySelector('#main > .hero, #main > .page-hero');
    var dark = !!h && h.getBoundingClientRect().bottom > 72;
    document.body.classList.toggle('nav-dark', dark);
  }
  window.addEventListener('scroll', function () { if (!navTick) { navTick = true; requestAnimationFrame(updateNav); } }, { passive: true });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('nav-open'); });
  var App = window.App = {
    render: function (html) {
      var root = document.getElementById('app');
      var key = location.hash.split('?')[0] + '|' + (location.hash.split('?')[1] || '');
      var fresh = key !== lastKey; lastKey = key;
      var prevScroll = window.scrollY;
      document.body.classList.remove('nav-open', 'no-scroll');
      root.innerHTML = html;
      if (fresh) window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      else window.scrollTo({ top: prevScroll, left: 0, behavior: 'instant' });
      UI.animate(root, fresh, { first: !App.booted, vt: !!App.inTransition });
      updateNav();
      var s = DB.settings();
      document.title = s.siteName + ' – ' + s.tagline;
      var fav = document.getElementById('favicon');
      if (fav) fav.href = s.logo || 'assets/favicon.svg';
      // menu mobile publik
      var burger = document.getElementById('burger');
      if (burger) {
        var setNav = function (o) {
          document.body.classList.toggle('nav-open', o);
          burger.setAttribute('aria-expanded', o); burger.setAttribute('aria-label', o ? 'Tutup menu' : 'Buka menu');
        };
        burger.onclick = function () { setNav(!document.body.classList.contains('nav-open')); };
        var tbm = document.getElementById('tb-menu'); if (tbm) tbm.onclick = function () { setNav(!document.body.classList.contains('nav-open')); };
        var scrim = document.getElementById('navscrim'); if (scrim) scrim.onclick = function () { setNav(false); };
        UI.$$('#mainnav a').forEach(function (a) { a.addEventListener('click', function () { setNav(false); }); });
      }
      // sidebar mobile
      var ba = document.getElementById('burger-app'), sb = document.getElementById('sidebar'), ov = document.getElementById('side-overlay');
      if (ba && sb) {
        ba.onclick = function () { sb.classList.add('open'); ov.classList.add('open'); };
        var tbs = document.getElementById('tb-side'); if (tbs) tbs.onclick = function () { sb.classList.add('open'); ov.classList.add('open'); };
        UI.$$('#sidebar a').forEach(function (a) { a.addEventListener('click', function () { sb.classList.remove('open'); ov.classList.remove('open'); }); });
        ov.onclick = function () { sb.classList.remove('open'); ov.classList.remove('open'); };
      }
      UI.$$('[data-logout]').forEach(function (a) {
        a.onclick = function (e) {
          e.preventDefault();
          Auth.logout().then(function () { UI.toast('Anda telah keluar.', 'info'); if (location.hash === '#/' || location.hash === '') route(); else location.hash = '#/'; });
        };
      });
    },
    refresh: route
  };

  window.addEventListener('hashchange', route);
  function bootError(err) {
    document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:2rem;font-family:system-ui"><div style="max-width:560px;text-align:center"><h2>Tidak dapat memuat data</h2><p style="color:#5F5B6E">' + UI.esc(err.message) + '</p><button onclick="location.reload()" style="padding:.7rem 1.2rem;border-radius:10px;border:0;background:#6D28D9;color:#fff;font-weight:700;cursor:pointer">Coba lagi</button></div></div>';
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('first-load');
    DB.load().then(function () {
      route(); App.booted = true;
      setTimeout(function () { document.body.classList.remove('first-load'); }, 1600);
    }).catch(bootError);
  });
})();

</script>
</body>
</html>
